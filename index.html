<script>
/* ══ js/paginas/inicio.js ══ */
/* ═══════════════════════════════════════════════════════════
   INICIO — pendientes, cómo viene el día y los atajos.
   Los dos bloques largos (pendientes y los remitos de hoy) se
   pliegan, así la pantalla entra de una en el celular.
   ═══════════════════════════════════════════════════════════ */

var _pendientes = [];

registrarPagina({
  id: 'inicio',
  menu: 'Inicio',
  grupo: 'Día a día',
  icono: 'home',
  titulo: 'Intencional',
  subtitulo: capitalizar(DIAS[new Date().getDay()]) + ', ' + new Date().getDate() + ' de ' + MESES[new Date().getMonth()],

  async montar(cont) {
    var datos = await Promise.all([
      traerCacheado('remitos'),
      traerCacheado('tareas').catch(function () { return []; })
    ]);
    var remitos = datos[0];
    _pendientes = datos[1];

    var hoy = claveFecha(hoyTexto());
    var deHoy = remitos.filter(function (r) {
      return claveFecha(r.fecha) === hoy || claveFecha(r.created_at) === hoy;
    });
    var visitas = deHoy.filter(function (r) { return r.motivo !== 'cerrado'; });
    var cerrados = deHoy.filter(function (r) { return r.motivo === 'cerrado'; });
    var res = resumirRemitos(visitas);

    cont.innerHTML =
      bloquePendientes() +

      '<div class="eyebrow" style="margin-top:22px">' + ic('calendar', 13) + ' Métricas de hoy</div>' +
      '<div class="grilla-stats">' +
        stat('users', 'Clientes de hoy', String(visitas.length),
             plural(res.unidades, 'unidad', 'unidades') + (cerrados.length ? ' · ' + cerrados.length + ' cerrados' : ''),
             'var(--rose)') +
        stat('db', 'Total (c/deuda)', plata(res.facturado),
             'Sin deuda: ' + plata(res.efectivo + res.transferencia), 'var(--violet)') +
        stat('cash', 'Efectivo', plata(res.efectivo), '', 'var(--ok)') +
        stat('smartphone', 'Transferencia', plata(res.transferencia), '', 'var(--info)') +
        stat('clock', 'Deuda', plata(res.deuda), '', 'var(--warn)') +
      '</div>' +

      '<div class="eyebrow" style="margin-top:22px">' + ic('zap', 13) + ' Accesos rápidos</div>' +
      '<div class="atajos">' +
        atajo('receipt', 'Crear remito', "irA('remito')", 'grad') +
        atajo('clipboard', 'Remitos hechos', "irA('hechos')", 'violeta') +
        atajo('user', 'Nuevo cliente', 'nuevoCliente()', 'rosa') +
        atajo('wallet', 'Gastos', "irA('gastos')", 'rojo') +
        atajo('settings', 'Configuraciones', "irA('configuraciones')", 'neutro') +
      '</div>' +

      bloqueRemitosHoy(deHoy);
  }
});

/* ── Atajos ──────────────────────────────────────────────── */
function atajo(icono, texto, accion, estilo) {
  return '<button class="atajo atajo-' + estilo + '" onclick="' + accion + '">' +
    ic(icono, 20) + '<span>' + esc(texto) + '</span></button>';
}

/* ── Pendientes ──────────────────────────────────────────── */
function bloquePendientes() {
  var abiertos = _pendientes.filter(function (t) { return !bool(t.hecha); });
  var hechas = _pendientes.filter(function (t) { return bool(t.hecha); });

  var porTipo = {};
  abiertos.forEach(function (t) { var k = t.tipo || 'otro'; porTipo[k] = (porTipo[k] || 0) + 1; });
  var resumen = Object.keys(TIPOS_PENDIENTE)
    .filter(function (k) { return porTipo[k]; })
    .map(function (k) {
      var d = TIPOS_PENDIENTE[k];
      return '<span class="pin ' + d.clase + '">' + ic(d.icono, 12) + ' ' + porTipo[k] + '</span>';
    }).join(' ');

  return '<details class="tarjeta"' + (abiertos.length ? ' open' : '') + '>' +
    '<summary class="tarjeta-cab" style="cursor:pointer">' +
      ic('clipboard', 16) + ' Pendientes' +
      '<span style="margin-left:auto;display:inline-flex;gap:5px;align-items:center">' +
        resumen +
        '<span class="pin pin-neutro">' +
          (abiertos.length ? abiertos.length + ' por hacer' : 'todo listo') +
        '</span>' +
      '</span>' +
    '</summary>' +
    '<div class="tarjeta-cuerpo">' +
      '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">' +
        '<input class="campo-input" id="pend-texto" style="flex:1;min-width:170px" ' +
               'placeholder="Agregar pendiente…" onkeydown="if(event.key===\'Enter\')agregarPendiente()"/>' +
        '<select class="campo-input" id="pend-tipo" style="width:auto">' +
          Object.keys(TIPOS_PENDIENTE).map(function (k) {
            return '<option value="' + k + '">' + esc(TIPOS_PENDIENTE[k].etiqueta) + '</option>';
          }).join('') +
        '</select>' +
        '<button class="btn btn-primario" onclick="agregarPendiente()" aria-label="Agregar">' + ic('plus', 17) + '</button>' +
      '</div>' +

      (abiertos.length
        ? '<div class="lista">' + abiertos.map(function (t) { return filaPendiente(t, false); }).join('') + '</div>'
        : '<div class="campo-ayuda">No queda nada pendiente. Agregá uno arriba si te acordás de algo.</div>') +

      (hechas.length
        ? '<div class="eyebrow" style="margin:16px 0 8px">Hechas</div>' +
          '<div class="lista">' + hechas.slice(0, 8).map(function (t) { return filaPendiente(t, true); }).join('') + '</div>'
        : '') +
    '</div>' +
  '</details>';
}

function filaPendiente(t, hecha) {
  var d = tipoPendiente(t);
  return '<div class="fila" style="cursor:default;border-left:3px solid ' + (hecha ? 'var(--border)' : d.color) + '">' +
    '<input type="checkbox"' + (hecha ? ' checked' : '') +
           ' onchange="marcarPendiente(' + t.id + ',this.checked)" aria-label="Marcar como hecho"/>' +
    '<div class="fila-principal">' +
      '<div class="fila-titulo"' + (hecha ? ' style="text-decoration:line-through;color:var(--muted);font-weight:500"' : '') + '>' +
        esc(t.texto) + '</div>' +
      (hecha ? '' : '<div class="fila-sub"><span class="pin ' + d.clase + '">' + ic(d.icono, 12) + ' ' + esc(d.etiqueta) + '</span></div>') +
    '</div>' +
    '<button class="btn btn-fantasma" style="padding:4px" aria-label="Borrar" onclick="borrarPendiente(' + t.id + ')">' + ic('trash', 15) + '</button>' +
  '</div>';
}

async function agregarPendiente() {
  var inp = porId('pend-texto');
  var texto = (inp.value || '').trim();
  if (!texto) { toast('Escribí el pendiente', 'error'); return; }
  try {
    await crear('tareas', { texto: texto, hecha: false, tipo: porId('pend-tipo').value });
    inp.value = '';
    toast('Pendiente agregado');
    pintarRuta();
  } catch (e) { toast(e.message, 'error'); }
}

async function marcarPendiente(id, hecha) {
  try { await actualizar('tareas', id, { hecha: hecha }); pintarRuta(); }
  catch (e) { toast(e.message, 'error'); }
}

async function borrarPendiente(id) {
  try { await borrar('tareas', id); toast('Pendiente borrado'); pintarRuta(); }
  catch (e) { toast(e.message, 'error'); }
}

/* ── Remitos de hoy ──────────────────────────────────────── */
function bloqueRemitosHoy(deHoy) {
  if (!deHoy.length) {
    return '<div class="tarjeta" style="margin-top:22px"><div class="tarjeta-cuerpo">' +
      vacio('receipt', 'Todavía no hay remitos hoy', 'Cuando cargues el primero, acá vas a ver el detalle del día.',
            '<button class="btn btn-primario" onclick="irA(\'remito\')">' + ic('plus', 15) + ' Cargar el primero</button>') +
      '</div></div>';
  }
  return '<details class="tarjeta" style="margin-top:22px">' +
    '<summary class="tarjeta-cab" style="cursor:pointer">' +
      ic('receipt', 16) + ' Remitos de hoy' +
      '<span style="margin-left:auto"><span class="pin pin-neutro">' + plural(deHoy.length, 'remito') + '</span></span>' +
    '</summary>' +
    '<div class="tarjeta-cuerpo" style="padding:0">' +
      '<div class="lista" style="border:none;border-radius:0">' + deHoy.slice().reverse().map(filaRemitoHoy).join('') + '</div>' +
    '</div>' +
  '</details>';
}

/* ── Bloques compartidos con otras páginas ───────────────── */
function stat(icono, etiqueta, valor, sub, color) {
  return '<div class="stat">' +
    '<div class="stat-etiq">' + ic(icono, 14) + esc(etiqueta) + '</div>' +
    '<div class="stat-val" style="color:' + color + '">' + esc(valor) + '</div>' +
    (sub ? '<div class="stat-sub">' + esc(sub) + '</div>' : '') +
  '</div>';
}

function filaRemitoHoy(r) {
  var cerrado = r.motivo === 'cerrado';
  return '<button class="fila" onclick="irA(\'hechos\',\'q=' + encodeURIComponent(r.cliente_nombre || '') + '\')">' +
    '<div class="fila-principal">' +
      '<div class="fila-titulo">' + esc(r.cliente_nombre || 'Sin cliente') +
        (cerrado ? ' <span class="pin pin-neutro">' + ic('ban', 12) + ' Cerrado</span>' : '') + '</div>' +
      '<div class="fila-sub">' +
        [r.cliente_loc, r.unidades ? plural(+r.unidades, 'unidad', 'unidades') : ''].filter(Boolean).map(esc).join(' · ') +
      '</div>' +
    '</div>' +
    '<div class="fila-derecha">' +
      '<div class="fila-titulo">' + plata(r.total) + '</div>' +
      (cerrado ? '' : '<div style="margin-top:4px">' + pagoHTML(r) + '</div>') +
    '</div>' +
  '</button>';
}

function capitalizar(s) { return String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1); }

</script>
<script>
/* ══ js/paginas/remito.js ══ */
/* ═══════════════════════════════════════════════════════════
   REMITO — la pantalla principal.
   Arriba, fuera del comprobante: el cliente, su última
   reposición, su deuda y los datos editables.
   Abajo: el remito propiamente dicho, que es lo que se comparte.
   ═══════════════════════════════════════════════════════════ */

var R = null;   // estado del remito en curso

function remitoVacio() {
  return {
    cliente: null,                 // fila de la tabla clientes
    nombre: '', dir: '', loc: '', tel: '',
    fecha: hoyTexto(),
    filas: [{ prod: '', cant: 1, precio: 0 }],
    notas: '',
    pago1: '', alias1: '',
    pago2: '', monto2: 0, alias2: '',
    guardando: false
  };
}

registrarPagina({
  id: 'remito',
  menu: 'Nuevo remito',
  grupo: 'Día a día',
  icono: 'receipt',
  titulo: 'Nuevo remito',
  subtitulo: 'Buscá el cliente o cargalo a mano',

  async montar(cont, params) {
    R = remitoVacio();
    _stock = await traerCacheado('stock');
    _clientesRemito = await traerCacheado('clientes');
    await cargarConfig().catch(function () {});

    var num = params.get('cliente');
    cont.innerHTML = '<div id="zona-cliente"></div><div id="zona-precios"></div><div id="zona-remito"></div>';
    pintarZonaCliente();
    pintarPrecios();
    pintarRemito();

    if (num) {
      var c = _clientesRemito.find(function (x) { return String(x.num) === String(num); });
      if (c) elegirCliente(c.num);
    }
  }
});

var _stock = [];
var _clientesRemito = [];
var _resultados = [];

/* ── Cliente ─────────────────────────────────────────────── */
function pintarZonaCliente() {
  var z = porId('zona-cliente');
  if (!z) return;

  if (!R.cliente) {
    z.innerHTML =
      '<div class="tarjeta"><div class="tarjeta-cuerpo">' +
        '<div class="buscador">' +
          '<span class="ic-lupa">' + ic('search', 16) + '</span>' +
          '<input class="campo-input" id="q-cli" autocomplete="off" ' +
                 'placeholder="Número, nombre, zona o dirección" oninput="buscarClienteRemito(this.value)"/>' +
        '</div>' +
        '<div id="res-cli"></div>' +
        '<div class="campo-ayuda" style="margin-top:8px">Si no está en la base, escribí los datos directamente en el remito.</div>' +
      '</div></div>';
    return;
  }

  var c = R.cliente;
  var rep = _ultimaRep;
  var deuda = _deudaCliente;

  z.innerHTML =
    '<div class="tarjeta">' +
      '<div class="tarjeta-cab" style="justify-content:space-between">' +
        '<span style="display:flex;align-items:center;gap:8px">' +
          '<span class="num-cliente">' + esc(c.num_str || c.num) + '</span>' + esc(c.local) +
        '</span>' +
        '<button class="btn btn-fantasma" style="padding:2px 6px" onclick="soltarCliente()" aria-label="Quitar cliente">✕</button>' +
      '</div>' +
      '<div class="tarjeta-cuerpo">' +

        '<div class="grilla-stats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px">' +
          '<div class="stat">' +
            '<div class="stat-etiq">' + ic('calendar', 14) + 'Última reposición</div>' +
            (rep
              ? '<div class="stat-val" style="font-size:17px">' + esc(fechaCorta(rep.fecha)) + '</div>' +
                '<div class="stat-sub">' + (rep.dias === 0 ? 'hoy' : rep.dias === 1 ? 'ayer' : 'hace ' + plural(rep.dias, 'día')) +
                  ' · ' + plata(rep.total) + ' · ' + plural(rep.unidades, 'unidad', 'unidades') + '</div>'
              : '<div class="stat-val" style="font-size:17px;color:var(--muted)">Primera vez</div>' +
                '<div class="stat-sub">no tiene remitos anteriores</div>') +
          '</div>' +
          '<div class="stat">' +
            '<div class="stat-etiq">' + ic('clock', 14) + 'Deuda</div>' +
            '<div class="stat-val" style="font-size:17px;color:' + (deuda > 0 ? 'var(--warn)' : 'var(--ok)') + '">' +
              (deuda > 0 ? plata(deuda) : 'Al día') + '</div>' +
            (deuda > 0 ? '<div class="stat-sub">' + plural(_remitosConDeuda, 'remito') + ' sin saldar</div>' : '') +
          '</div>' +
        '</div>' +

        (clienteAvisado(c)
          ? avisoHTML('ok', 'Ya se le avisó del aumento' +
              (c.aviso_aumento_fecha ? ' el <strong>' + esc(fechaCorta(c.aviso_aumento_fecha)) + '</strong>' : '') +
              '. Por eso el aviso no sale en el remito. ' +
              '<button class="btn btn-fantasma" style="padding:0;text-decoration:underline" onclick="volverAAvisar()">Volver a avisar</button>', 'check')
          : '') +

        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          '<button class="btn btn-secundario" onclick="abrirEditarCliente()">' + ic('edit', 15) + ' Editar datos</button>' +
          '<button class="btn btn-secundario" onclick="marcarCerrado()">' + ic('ban', 15) + ' Estaba cerrado</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function buscarClienteRemito(q) {
  var cont = porId('res-cli');
  if (!q || q.length < 2) { cont.innerHTML = ''; return; }
  _resultados = _clientesRemito.filter(clienteActivo)
    .filter(function (c) { return coincideCliente(c, q); })
    .slice(0, 8);

  cont.innerHTML = _resultados.length
    ? '<div class="lista" style="margin-top:10px">' + _resultados.map(function (c) {
        return '<button class="fila" onclick="elegirCliente(' + JSON.stringify(String(c.num)) + ')">' +
          '<span class="num-cliente">' + esc(c.num_str || c.num) + '</span>' +
          '<div class="fila-principal">' +
            '<div class="fila-titulo">' + esc(c.local) + '</div>' +
            '<div class="fila-sub">' + [c.loc, c.dir].filter(Boolean).map(esc).join(' · ') + '</div>' +
          '</div></button>';
      }).join('') + '</div>'
    : '<div class="campo-ayuda" style="margin-top:10px">Ningún cliente coincide con “' + esc(q) + '”.</div>';
}

var _ultimaRep = null, _deudaCliente = 0, _remitosConDeuda = 0;

async function elegirCliente(num) {
  var c = _clientesRemito.find(function (x) { return String(x.num) === String(num); });
  if (!c) return;
  R.cliente = c;
  R.nombre = c.local || '';
  R.dir = c.dir || '';
  R.loc = c.loc || '';
  R.tel = c.tel || '';

  _ultimaRep = null; _deudaCliente = 0; _remitosConDeuda = 0;
  pintarZonaCliente();
  pintarRemito();

  try {
    var suyos = await traerTodo('remitos', 'cliente_nombre=eq.' + encodeURIComponent(c.local));
    if (!R.cliente || R.cliente.num !== c.num) return;   // cambió mientras cargaba
    _ultimaRep = ultimaReposicion(c.local, suyos);
    var conDeuda = suyos.filter(tieneDeuda);
    _remitosConDeuda = conDeuda.length;
    _deudaCliente = sumarTipo(conDeuda, 'deuda');
  } catch (e) { console.warn('historial del cliente:', e.message); }

  aplicarPrecioSugerido();
  pintarZonaCliente();
  pintarRemito();
}

function soltarCliente() {
  R.cliente = null; _ultimaRep = null; _deudaCliente = 0;
  pintarZonaCliente(); pintarRemito();
}

/* ── Editar datos del cliente sin salir del remito ────────── */
function abrirEditarCliente() {
  var c = R.cliente; if (!c) return;
  var campos = [
    { k: 'local', et: 'Nombre del local' },
    { k: 'dir',   et: 'Dirección' },
    { k: 'loc',   et: 'Localidad / zona' },
    { k: 'tel',   et: 'Teléfono' }
  ];
  abrirModal('Datos de ' + (c.local || 'el cliente'),
    campos.map(function (f) {
      return '<div class="campo"><div class="campo-etiq">' + esc(f.et) + '</div>' +
        '<input class="campo-input" id="ec-' + f.k + '" value="' + esc(c[f.k] || '') + '"/></div>';
    }).join(''),
    '<button class="btn btn-primario btn-bloque" onclick="guardarEditarCliente()">Guardar en la base</button>');
}

async function guardarEditarCliente() {
  var c = R.cliente; if (!c) return;
  var cambios = {};
  ['local', 'dir', 'loc', 'tel'].forEach(function (k) {
    var el = porId('ec-' + k); if (!el) return;
    var v = el.value.trim();
    if (v !== (c[k] || '')) cambios[k] = v || null;
  });
  if (!Object.keys(cambios).length) { cerrarModal(); return; }

  try {
    await actualizar('clientes', c.num, cambios);
    Object.assign(c, cambios);
    R.nombre = c.local || ''; R.dir = c.dir || ''; R.loc = c.loc || ''; R.tel = c.tel || '';
    cerrarModal();
    pintarZonaCliente(); pintarRemito();
    toast('Datos actualizados');
  } catch (e) {
    toast(e.message, 'error');
  }
}

/* ── Cliente cerrado: queda registrado como un remito más ── */
function marcarCerrado() {
  var c = R.cliente; if (!c) return;
  abrirModal('Marcar como cerrado',
    '<p style="font-size:13px;color:var(--text2);line-height:1.6">Se guarda un remito de ' + plata(0) +
    ' para <strong>' + esc(c.local) + '</strong> con fecha de hoy. Queda en el historial como visita, ' +
    'pero no suma a lo facturado.</p>' +
    '<div class="campo" style="margin-top:12px"><div class="campo-etiq">Nota (opcional)</div>' +
    '<input class="campo-input" id="cerrado-nota" placeholder="Ej: cerrado por vacaciones"/></div>',
    '<button class="btn btn-primario btn-bloque" onclick="confirmarCerrado()">Registrar la visita</button>');
}

async function confirmarCerrado() {
  var c = R.cliente; if (!c) return;
  var nota = (porId('cerrado-nota').value || '').trim();
  try {
    await crear('remitos', {
      fecha: hoyTexto(),
      cliente_nombre: c.local, cliente_dir: c.dir, cliente_loc: c.loc, cliente_tel: c.tel,
      total: 0, unidades: 0, pago: 'sin_definir',
      productos: '[]', pagos_detalle: JSON.stringify([{ tipo: 'sin_definir', monto: 0 }]),
      motivo: 'cerrado', notas: nota || null,
      created_at: new Date().toISOString()
    });
    cerrarModal();
    toast('Visita registrada: estaba cerrado');
    irA('inicio');
  } catch (e) { toast(e.message, 'error'); }
}

async function volverAAvisar() {
  var c = R.cliente; if (!c) return;
  try {
    await actualizar('clientes', c.num, { aviso_aumento: false, aviso_aumento_fecha: null });
    c.aviso_aumento = false; c.aviso_aumento_fecha = null;
    aplicarPrecioSugerido();
    pintarZonaCliente(); pintarRemito();
    toast('El aviso vuelve a salir en el remito');
  } catch (e) { toast(e.message, 'error'); }
}

/* ── Lista de precios: se ve siempre, con o sin cliente ───── */
function pintarPrecios() {
  var z = porId('zona-precios'); if (!z) return;
  var conPrecio = _stock.filter(function (s) { return +s.precio > 0; });
  if (!conPrecio.length) { z.innerHTML = ''; return; }

  var cfg = aumentoConfig();
  z.innerHTML =
    '<details class="tarjeta" open>' +
      '<summary class="tarjeta-cab" style="cursor:pointer;list-style:none">' +
        ic('tag', 16) + ' Precios' +
        '<span style="margin-left:auto;font-size:11px;color:var(--muted);font-weight:500">' +
          plural(conPrecio.length, 'producto') + '</span>' +
      '</summary>' +
      '<div class="tarjeta-cuerpo" style="padding-top:12px">' +
        '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
          conPrecio.map(function (s) {
            var enAumento = cfg.activo && esProductoEnAumento(s.nombre);
            return '<div class="pin ' + (enAumento ? 'pin-warn' : 'pin-neutro') + '" style="padding:6px 12px;font-size:12px">' +
              esc(s.nombre) + ' · <strong>' + plata(s.precio) + '</strong>' + '</div>';
          }).join('') +
        '</div>' +
        (cfg.activo
          ? '<div class="campo-ayuda" style="margin-top:10px">' + esc(cfg.producto) + ': ' + plata(cfg.viejo) +
            ' para quien no fue avisado, ' + plata(cfg.nuevo) + ' para quien ya sabe del aumento.</div>'
          : '') +
      '</div>' +
    '</details>';
}

/* ── El remito ───────────────────────────────────────────── */
function totalRemito() {
  return R.filas.reduce(function (s, f) { return s + (+f.cant || 0) * (+f.precio || 0); }, 0);
}
function unidadesRemito() {
  return R.filas.reduce(function (s, f) { return s + (+f.cant || 0); }, 0);
}

function pintarRemito() {
  var z = porId('zona-remito'); if (!z) return;
  var total = totalRemito();
  var mostrarAviso = aumentoConfig().activo && !clienteAvisado(R.cliente);

  z.innerHTML =
    '<div class="tarjeta" id="remito-card">' +
      '<div style="padding:18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px">' +
        '<img src="' + LOGO_INTENCIONAL + '" style="width:44px;height:44px;object-fit:contain" alt=""/>' +
        '<div>' +
          '<div class="marca-nombre">Intencional</div>' +
          '<div class="marca-sub">Esmaltes · Cremas · Belleza</div>' +
        '</div>' +
        '<div style="margin-left:auto;text-align:right">' +
          '<div class="campo-etiq" style="margin:0">Fecha</div>' +
          '<div style="font-weight:600">' + esc(R.fecha) + '</div>' +
        '</div>' +
      '</div>' +

      '<div class="tarjeta-cuerpo">' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">' +
          campoTexto('Cliente', 'r-nombre', R.nombre, 'Nombre del local') +
          campoTexto('Dirección', 'r-dir', R.dir, 'Calle y número') +
          campoTexto('Localidad', 'r-loc', R.loc, 'Ciudad / partido') +
          campoTexto('Teléfono', 'r-tel', R.tel, 'Opcional') +
        '</div>' +

        '<div class="eyebrow" style="margin-top:18px">Productos</div>' +
        '<div id="filas-remito">' + R.filas.map(filaProducto).join('') + '</div>' +
        '<button class="btn btn-secundario" style="margin-top:8px" onclick="agregarFila()">' + ic('plus', 15) + ' Agregar producto</button>' +

        '<div class="campo" style="margin-top:18px">' +
          '<div class="campo-etiq">Notas u observaciones</div>' +
          '<input class="campo-input" id="r-notas" value="' + esc(R.notas) + '" ' +
                 'placeholder="Ej: pidió reponer crema la semana que viene" oninput="R.notas=this.value"/>' +
        '</div>' +

        '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)">' +
          '<div class="campo-etiq" style="margin:0">Total</div>' +
          '<div class="stat-val" style="font-size:26px;color:var(--rose)">' + plata(total) + '</div>' +
        '</div>' +

        (mostrarAviso
          ? '<div class="aviso aviso-warn" id="bloque-aviso" style="margin-top:14px">' + ic('megaphone', 15) +
            '<div><strong>Aviso:</strong> ' + esc(textoAviso(aumentoConfig().nuevo)) + '</div></div>'
          : '') +

        (R.notas ? '' : '') +
      '</div>' +
    '</div>' +

    /* Fuera del remito: cómo se paga y el botón de confirmar */
    '<div class="tarjeta">' +
      '<div class="tarjeta-cab">' + ic('wallet', 16) + ' Cómo se paga</div>' +
      '<div class="tarjeta-cuerpo">' +
        botonesPago(1) +
        (R.pago1
          ? '<div style="margin-top:14px">' +
              (R.pago2
                ? '<div class="campo"><div class="campo-etiq">Monto del segundo pago</div>' +
                  '<input class="campo-input" type="number" inputmode="decimal" min="0" id="r-monto2" ' +
                         'value="' + (R.monto2 || '') + '" oninput="R.monto2=+this.value||0;pintarDesglose()"/>' +
                  '<div class="campo-ayuda" id="resto-pago"></div></div>'
                : '') +
              botonesPago(2) +
            '</div>'
          : '') +
        '<div id="desglose"></div>' +
        '<button class="btn btn-primario btn-bloque" style="margin-top:16px" id="btn-confirmar" onclick="confirmarRemito()">' +
          ic('check', 16) + ' Confirmar y compartir' +
        '</button>' +
      '</div>' +
    '</div>';

  pintarDesglose();
}

function campoTexto(etiqueta, id, valor, ph) {
  return '<div class="campo" style="margin:0">' +
    '<div class="campo-etiq">' + esc(etiqueta) + '</div>' +
    '<input class="campo-input" id="' + id + '" value="' + esc(valor) + '" placeholder="' + esc(ph) + '" ' +
           'oninput="R.' + id.slice(2) + '=this.value"/>' +
  '</div>';
}

function filaProducto(f, i) {
  var opciones = ['<option value="">— elegir —</option>'].concat(
    _stock.filter(function (s) { return s.nombre; }).map(function (s) {
      return '<option' + (normalizar(s.nombre) === normalizar(f.prod) ? ' selected' : '') + '>' + esc(s.nombre) + '</option>';
    })).join('');

  return '<div style="display:grid;grid-template-columns:1fr 68px 96px 32px;gap:8px;align-items:center;margin-bottom:8px">' +
    '<select class="campo-input" onchange="cambiarProducto(' + i + ',this.value)">' + opciones + '</select>' +
    '<input class="campo-input" type="number" min="0" inputmode="numeric" value="' + (+f.cant || 0) + '" ' +
           'aria-label="Cantidad" oninput="R.filas[' + i + '].cant=+this.value||0;pintarTotales()"/>' +
    '<input class="campo-input" type="number" min="0" inputmode="decimal" value="' + (+f.precio || 0) + '" ' +
           'aria-label="Precio" oninput="R.filas[' + i + '].precio=+this.value||0;pintarTotales()"/>' +
    (R.filas.length > 1
      ? '<button class="btn btn-fantasma" style="padding:4px" aria-label="Quitar" onclick="quitarFila(' + i + ')">✕</button>'
      : '<span></span>') +
  '</div>';
}

function cambiarProducto(i, nombre) {
  R.filas[i].prod = nombre;
  var sugerido = R.cliente && esProductoEnAumento(nombre) ? precioParaCliente(R.cliente) : 0;
  R.filas[i].precio = sugerido || precioDeLista(nombre, _stock) || R.filas[i].precio || 0;
  pintarRemito();
}

function agregarFila() { R.filas.push({ prod: '', cant: 1, precio: 0 }); pintarRemito(); }
function quitarFila(i) { R.filas.splice(i, 1); pintarRemito(); }

/* Cuando cambia el cliente, se actualiza el precio del producto en aumento,
   pero nunca se pisa un precio escrito a mano. */
function aplicarPrecioSugerido() {
  var cfg = aumentoConfig();
  if (!cfg.activo) return;
  var nuevo = precioParaCliente(R.cliente);
  R.filas.forEach(function (f) {
    if (!esProductoEnAumento(f.prod)) return;
    var actual = +f.precio || 0;
    if (!actual || actual === cfg.viejo || actual === cfg.nuevo) f.precio = nuevo;
  });
}

function pintarTotales() {
  var z = porId('zona-remito');
  if (!z) return;
  var t = z.querySelector('.stat-val');
  if (t) t.textContent = plata(totalRemito());
  pintarDesglose();
}

function botonesPago(cual) {
  var actual = cual === 1 ? R.pago1 : R.pago2;
  var etiqueta = cual === 1 ? 'Medio de pago' : 'Segundo medio de pago (opcional)';
  return '<div class="campo-etiq">' + etiqueta + '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      ['efectivo', 'transferencia', 'deuda'].map(function (t) {
        var d = TIPOS_PAGO[t];
        var activo = actual === t;
        return '<button class="btn ' + (activo ? 'btn-primario' : 'btn-secundario') + '" ' +
          'onclick="setPago(' + cual + ',\'' + t + '\')">' + ic(d.icono, 15) + ' ' + esc(d.corta) + '</button>';
      }).join('') +
      (actual && cual === 2
        ? '<button class="btn btn-fantasma" onclick="setPago(2,\'\')">Quitar</button>'
        : '') +
    '</div>';
}

function setPago(cual, tipo) {
  if (cual === 1) { R.pago1 = tipo; }
  else { R.pago2 = tipo; if (!tipo) R.monto2 = 0; }
  pintarRemito();
}

/* El desglose entra en la imagen: si hay dos medios, el cliente
   tiene que ver cuánto pagó de cada forma. */
function pintarDesglose() {
  var partes = partesDelFormulario();
  var cont = porId('desglose');
  var resto = porId('resto-pago');
  if (resto) {
    var r = totalRemito() - (+R.monto2 || 0);
    resto.textContent = 'Con el primer medio quedan ' + plata(Math.max(0, r)) + '.';
  }
  if (!cont) return;

  var visibles = partes.filter(function (p) { return p.monto > 0; });
  if (visibles.length < 2) { cont.innerHTML = ''; return; }
  cont.innerHTML =
    '<div class="tarjeta" style="margin:14px 0 0;box-shadow:none">' +
      '<div class="tarjeta-cuerpo" style="padding:12px 14px">' +
        '<div class="campo-etiq">Forma de pago</div>' +
        visibles.map(function (p) {
          var d = TIPOS_PAGO[p.tipo] || TIPOS_PAGO.sin_definir;
          return '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px">' +
            '<span style="color:' + d.color + ';font-weight:600">' + ic(d.icono, 13) + ' ' + esc(d.etiqueta) + '</span>' +
            '<strong>' + plata(p.monto) + '</strong></div>';
        }).join('') +
      '</div>' +
    '</div>';
}

function partesDelFormulario() {
  var total = totalRemito();
  var m2 = Math.min(+R.monto2 || 0, total);
  var partes = [{ tipo: R.pago1 || 'sin_definir', monto: R.pago2 && m2 > 0 ? total - m2 : total, alias: R.alias1 || null }];
  if (R.pago2 && m2 > 0) partes.push({ tipo: R.pago2, monto: m2, alias: R.alias2 || null });
  return partes;
}

/* ── Confirmar ───────────────────────────────────────────── */
async function confirmarRemito() {
  var btn = porId('btn-confirmar');
  var total = totalRemito();

  if (!R.nombre.trim()) { toast('Falta el nombre del cliente', 'error'); return; }
  if (!R.filas.some(function (f) { return f.prod && f.cant > 0; })) { toast('Agregá al menos un producto', 'error'); return; }
  if (!R.pago1) { toast('Elegí cómo se paga', 'error'); return; }

  if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
  var partes = partesDelFormulario();
  var m2 = Math.min(+R.monto2 || 0, total);

  var remito = {
    fecha: R.fecha,
    cliente_nombre: R.nombre.trim(),
    cliente_dir: R.dir || null,
    cliente_loc: R.loc || null,
    cliente_tel: R.tel || null,
    total: total,
    unidades: unidadesRemito(),
    pago: R.pago1,
    alias: R.alias1 || null,
    notas: R.notas.trim() || null,
    productos: JSON.stringify(R.filas.filter(function (f) { return f.prod; })
      .map(function (f) { return { prod: f.prod, cant: +f.cant || 0, precio: +f.precio || 0 }; })),
    pagos_detalle: JSON.stringify(partes),
    created_at: new Date().toISOString()
  };
  if (R.pago2 && m2 > 0) {
    remito.pago2_tipo = R.pago2;
    remito.pago2_monto = m2;
    remito.pago2_alias = R.alias2 || null;
  }

  try {
    await crear('remitos', remito);
    await marcarAvisoSiSalio();
    toast('Remito guardado');
    R = remitoVacio();
    irA('hechos');
  } catch (e) {
    if (btn) { btn.disabled = false; btn.innerHTML = ic('check', 16) + ' Confirmar y compartir'; }
    toast(e.message, 'error');
  }
}

/* Si el aviso salió impreso en el remito, queda registrado con la fecha */
async function marcarAvisoSiSalio() {
  var c = R.cliente;
  if (!c || !c.num || clienteAvisado(c)) return;
  if (!aumentoConfig().activo) return;
  try {
    await actualizar('clientes', c.num, { aviso_aumento: true, aviso_aumento_fecha: hoyISO() });
    c.aviso_aumento = true;
    c.aviso_aumento_fecha = hoyISO();
  } catch (e) { console.warn('no se pudo marcar el aviso:', e.message); }
}

</script>
<script>
/* ══ js/paginas/hechos.js ══ */
/* ═══════════════════════════════════════════════════════════
   REMITOS HECHOS — historial con el buscador ampliado:
   número de cliente, zona, nombre y dirección en un solo campo.
   ═══════════════════════════════════════════════════════════ */

var _hechos = [];
var _porNombre = {};      // nombre normalizado → cliente, para poder buscar por número
var _qHechos = '';
var _filtroHechos = '';
var _topeHechos = 40;

registrarPagina({
  id: 'hechos',
  menu: 'Remitos hechos',
  grupo: 'Día a día',
  icono: 'clipboard',
  titulo: 'Remitos hechos',
  subtitulo: 'Buscá por número de cliente, nombre, zona o dirección',

  async montar(cont, params) {
    _qHechos = params.get('q') || '';
    _filtroHechos = params.get('filtro') || '';
    _topeHechos = 40;

    var res = await Promise.all([traerCacheado('remitos'), traerCacheado('clientes')]);
    _hechos = res[0].slice().reverse();

    /* El remito guarda el nombre del cliente pero no su número.
       Este índice permite igual buscar por número: se resuelve
       contra la tabla de clientes por nombre. */
    _porNombre = {};
    res[1].forEach(function (c) { _porNombre[normalizar(c.local)] = c; });

    cont.innerHTML =
      '<div class="buscador" style="margin-bottom:12px">' +
        '<span class="ic-lupa">' + ic('search', 16) + '</span>' +
        '<input class="campo-input" id="q-hechos" type="search" autocomplete="off" ' +
               'placeholder="Ej: r14-0310, Farmacia Posik, chingolo, Belgrano 378" ' +
               'value="' + esc(_qHechos) + '" oninput="filtrarHechos(this.value)"/>' +
      '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">' +
        chipFiltro('', 'Todos') +
        chipFiltro('deuda', 'Con deuda') +
        chipFiltro('cerrado', 'Estaban cerrados') +
      '</div>' +
      '<div id="resumen-hechos"></div>' +
      '<div id="lista-hechos"></div>';

    pintarHechos();
  }
});

function chipFiltro(valor, etiqueta) {
  return '<button class="btn ' + (_filtroHechos === valor ? 'btn-primario' : 'btn-secundario') + '" ' +
    'style="padding:7px 13px" onclick="setFiltroHechos(\'' + valor + '\')">' + esc(etiqueta) + '</button>';
}

function setFiltroHechos(v) { _filtroHechos = v; _topeHechos = 40; irA('hechos', 'filtro=' + v + (_qHechos ? '&q=' + encodeURIComponent(_qHechos) : '')); }
function filtrarHechos(v) { _qHechos = v; _topeHechos = 40; pintarHechos(); }
function verMasHechos() { _topeHechos += 40; pintarHechos(); }

/* Un remito coincide si coincide su propio texto o el del cliente
   al que pertenece (por eso el índice por nombre). */
function coincideRemito(r, termino) {
  var t = normalizar(termino);
  if (!t) return true;
  if (normalizar(r.cliente_nombre).indexOf(t) !== -1) return true;
  if (normalizar(r.cliente_loc).indexOf(t) !== -1) return true;
  if (normalizar(r.cliente_dir).indexOf(t) !== -1) return true;
  var c = _porNombre[normalizar(r.cliente_nombre)];
  if (c && (normalizar(c.num_str).indexOf(t) !== -1 || String(c.num || '').indexOf(t) !== -1)) return true;
  return false;
}

function hechosFiltrados() {
  return _hechos.filter(function (r) {
    if (_filtroHechos === 'deuda' && !tieneDeuda(r)) return false;
    if (_filtroHechos === 'cerrado' && r.motivo !== 'cerrado') return false;
    return coincideRemito(r, _qHechos);
  });
}

function pintarHechos() {
  var lista = hechosFiltrados();
  var res = resumirRemitos(lista);

  var resumen = porId('resumen-hechos');
  if (resumen) {
    resumen.innerHTML = '<div class="grilla-stats" style="margin-bottom:14px">' +
      stat('clipboard', 'Remitos', String(res.cantidad), plural(res.unidades, 'unidad', 'unidades'), 'var(--violet)') +
      stat('receipt', 'Facturado', plata(res.facturado), '', 'var(--rose)') +
      stat('cash', 'Cobrado', plata(res.efectivo + res.transferencia), '', 'var(--ok)') +
      (res.deuda > 0 ? stat('clock', 'En deuda', plata(res.deuda), '', 'var(--warn)') : '') +
    '</div>';
  }

  var cont = porId('lista-hechos');
  if (!cont) return;
  if (!lista.length) {
    cont.innerHTML = vacio('search', 'Sin resultados',
      _qHechos ? 'Probá con el número de cliente, la zona o parte de la dirección.' : 'Todavía no hay remitos con este filtro.');
    return;
  }

  cont.innerHTML =
    '<div class="lista">' + lista.slice(0, _topeHechos).map(filaHecho).join('') + '</div>' +
    (lista.length > _topeHechos
      ? '<button class="btn btn-secundario btn-bloque" style="margin-top:12px" onclick="verMasHechos()">Ver más</button>'
      : '');
}

function filaHecho(r) {
  var c = _porNombre[normalizar(r.cliente_nombre)];
  var cerrado = r.motivo === 'cerrado';
  return '<button class="fila" onclick="verRemito(' + r.id + ')">' +
    (c ? '<span class="num-cliente">' + esc(c.num_str || c.num) + '</span>' : '') +
    '<div class="fila-principal">' +
      '<div class="fila-titulo">' + esc(r.cliente_nombre || 'Sin cliente') +
        (cerrado ? ' <span class="pin pin-neutro">' + ic('ban', 12) + ' Cerrado</span>' : '') + '</div>' +
      '<div class="fila-sub">' + [fechaCorta(r.fecha), r.cliente_loc, r.cliente_dir].filter(Boolean).map(esc).join(' · ') + '</div>' +
    '</div>' +
    '<div class="fila-derecha">' +
      '<div class="fila-titulo">' + plata(r.total) + '</div>' +
      '<div style="margin-top:4px">' + pagoHTML(r) + '</div>' +
    '</div>' +
  '</button>';
}

function verRemito(id) {
  var r = _hechos.find(function (x) { return String(x.id) === String(id); });
  if (!r) return;
  var prods = [];
  try { prods = typeof r.productos === 'string' ? JSON.parse(r.productos || '[]') : (r.productos || []); } catch (e) {}

  abrirModal('Remito de ' + (r.cliente_nombre || '—'),
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">' +
      dato('Fecha', fechaCorta(r.fecha)) +
      dato('Localidad', r.cliente_loc || '—') +
      dato('Dirección', r.cliente_dir || '—') +
      dato('Teléfono', r.cliente_tel || '—') +
    '</div>' +
    (prods.length
      ? '<table class="tabla"><thead><tr><th>Producto</th><th class="num">Cant</th><th class="num">Precio</th><th class="num">Subtotal</th></tr></thead><tbody>' +
        prods.map(function (p) {
          return '<tr><td>' + esc(p.prod) + '</td><td class="num">' + (+p.cant || 0) + '</td>' +
            '<td class="num">' + plata(p.precio) + '</td><td class="num">' + plata((+p.cant || 0) * (+p.precio || 0)) + '</td></tr>';
        }).join('') + '</tbody></table>'
      : '<div class="campo-ayuda">Sin productos: se registró como visita.</div>') +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">' +
      '<span class="campo-etiq" style="margin:0">Total</span>' +
      '<strong style="font-size:19px;color:var(--rose)">' + plata(r.total) + '</strong>' +
    '</div>' +
    '<div style="margin-top:10px">' + pagoHTML(r) + '</div>' +
    (r.notas ? '<div class="aviso aviso-warn" style="margin-top:14px">' + ic('edit', 15) + '<div>' + esc(r.notas) + '</div></div>' : ''),
    '');
}

function dato(etiqueta, valor) {
  return '<div><div class="campo-etiq">' + esc(etiqueta) + '</div>' +
    '<div style="font-size:13px;font-weight:600">' + esc(valor) + '</div></div>';
}

</script>
<script>
/* ══ js/paginas/clientes.js ══ */
/* ═══════════════════════════════════════════════════════════
   CLIENTES — listado con el buscador único: número, nombre,
   zona, dirección o dueño, todo en el mismo campo.
   ═══════════════════════════════════════════════════════════ */

var _clientes = [];
var _terminoCliente = '';
var _mostrarInactivos = false;
var _topeVisible = 60;   // se pinta de a tandas: son casi mil filas

registrarPagina({
  id: 'clientes',
  menu: 'Clientes',
  grupo: 'Día a día',
  icono: 'users',
  titulo: 'Clientes',
  subtitulo: 'Buscá por número, nombre, zona o dirección',

  async montar(cont, params) {
    _terminoCliente = params.get('q') || '';
    _topeVisible = 60;
    _clientes = await traerCacheado('clientes');

    cont.innerHTML =
      '<div class="buscador" style="margin-bottom:14px">' +
        '<span class="ic-lupa">' + ic('search', 16) + '</span>' +
        '<input class="campo-input" id="q-clientes" type="search" autocomplete="off" ' +
               'placeholder="Ej: r14-0310, Farmacia Posik, chingolo, Belgrano 378" ' +
               'value="' + esc(_terminoCliente) + '" oninput="filtrarClientes(this.value)"/>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap">' +
        '<div id="cuenta-clientes" style="font-size:12px;color:var(--muted)"></div>' +
        '<label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer;margin-left:auto">' +
          '<input type="checkbox" onchange="alternarInactivos(this.checked)"' + (_mostrarInactivos ? ' checked' : '') + '/> Ver inactivos' +
        '</label>' +
      '</div>' +
      '<div id="lista-clientes"></div>';

    pintarClientes();
  }
});

function filtrarClientes(v) {
  _terminoCliente = v;
  _topeVisible = 60;
  pintarClientes();
}

function alternarInactivos(v) {
  _mostrarInactivos = v;
  _topeVisible = 60;
  pintarClientes();
}

function clientesFiltrados() {
  return _clientes.filter(function (c) {
    if (!_mostrarInactivos && !clienteActivo(c)) return false;
    return coincideCliente(c, _terminoCliente);
  });
}

function pintarClientes() {
  var lista = clientesFiltrados();
  var cuenta = porId('cuenta-clientes');
  if (cuenta) {
    cuenta.textContent = _terminoCliente
      ? plural(lista.length, 'resultado') + ' de ' + _clientes.length
      : plural(lista.length, 'cliente');
  }

  var cont = porId('lista-clientes');
  if (!cont) return;

  if (!lista.length) {
    cont.innerHTML = _terminoCliente
      ? vacio('search', 'Sin resultados para “' + _terminoCliente + '”', 'Probá con el número de cliente, la zona o parte de la dirección.')
      : vacio('users', 'Todavía no hay clientes', 'Cuando cargues el primero va a aparecer acá.');
    return;
  }

  var visibles = lista.slice(0, _topeVisible);
  cont.innerHTML =
    '<div class="lista">' + visibles.map(filaCliente).join('') + '</div>' +
    (lista.length > _topeVisible
      ? '<button class="btn btn-secundario btn-bloque" style="margin-top:12px" onclick="verMasClientes()">' +
          'Ver ' + Math.min(60, lista.length - _topeVisible) + ' más de ' + (lista.length - _topeVisible) +
        '</button>'
      : '');
}

function verMasClientes() { _topeVisible += 60; pintarClientes(); }

function filaCliente(c) {
  var ruta = rutaDe(c);
  return '<button class="fila" onclick="irA(\'cliente\',\'num=' + encodeURIComponent(c.num) + '\')">' +
    '<span class="num-cliente">' + esc(c.num_str || c.num) + '</span>' +
    '<div class="fila-principal">' +
      '<div class="fila-titulo">' + esc(c.local || 'Sin nombre') +
        (!clienteActivo(c) ? ' <span class="pin pin-neutro">Inactivo</span>' : '') +
      '</div>' +
      '<div class="fila-sub">' +
        [c.loc, c.dir, ruta ? 'Ruta ' + ruta : ''].filter(Boolean).map(esc).join(' · ') +
      '</div>' +
    '</div>' +
    (c.aviso_aumento
      ? '<span class="pin pin-ok">' + ic('check', 12) + ' Avisado</span>'
      : '') +
  '</button>';
}

/* ── Alta rápida de cliente ──────────────────────────────── */
function nuevoCliente() {
  abrirModal('Nuevo cliente',
    '<div class="campo"><div class="campo-etiq">Nombre del local</div>' +
      '<input class="campo-input" id="nc-local" placeholder="Ej: Perfumería Sol"/></div>' +
    '<div class="campo"><div class="campo-etiq">Dirección</div>' +
      '<input class="campo-input" id="nc-dir" placeholder="Calle y número"/></div>' +
    '<div class="campo"><div class="campo-etiq">Localidad / zona</div>' +
      '<input class="campo-input" id="nc-loc" placeholder="Ciudad o partido"/></div>' +
    '<div class="campo"><div class="campo-etiq">Teléfono</div>' +
      '<input class="campo-input" id="nc-tel" inputmode="tel" placeholder="11-1234-5678"/></div>' +
    '<div class="campo" style="margin:0"><div class="campo-etiq">Dueño (opcional)</div>' +
      '<input class="campo-input" id="nc-duenio"/></div>',
    '<button class="btn btn-primario btn-bloque" onclick="guardarNuevoCliente()">Guardar cliente</button>');
}

async function guardarNuevoCliente() {
  var local = (porId('nc-local').value || '').trim();
  if (!local) { toast('Escribí el nombre del local', 'error'); return; }
  try {
    var todos = await traerCacheado('clientes');
    var siguiente = todos.reduce(function (m, c) { return Math.max(m, +c.num || 0); }, 0) + 1;
    await crear('clientes', {
      num: siguiente,
      num_str: String(siguiente),
      local: local,
      dir: (porId('nc-dir').value || '').trim() || null,
      loc: (porId('nc-loc').value || '').trim() || null,
      tel: (porId('nc-tel').value || '').trim() || null,
      duenio: (porId('nc-duenio').value || '').trim() || null,
      fecha: hoyTexto(),
      activo: true,
      created_at: new Date().toISOString()
    });
    cerrarModal();
    toast('Cliente guardado con el número ' + siguiente);
    irA('clientes');
  } catch (e) { toast(e.message, 'error'); }
}

</script>
<script>
/* ══ js/paginas/compras.js ══ */
/* ═══════════════════════════════════════════════════════════
   COMPRAS — la mercadería que entra.
   ═══════════════════════════════════════════════════════════ */

var _compras = [], _mesCompra = '';

registrarPagina({
  id: 'compras',
  menu: 'Compras',
  grupo: 'Plata',
  icono: 'cart',
  titulo: 'Compras',
  subtitulo: 'Mercadería que entra y lo que costó',

  async montar(cont) {
    _compras = (await traerCacheado('compras')).slice().reverse();
    if (!_mesCompra) _mesCompra = claveMes(hoyTexto());
    cont.innerHTML =
      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">' +
        selectorMes('_mesCompra', _compras, 'pintarCompras') +
        '<button class="btn btn-primario" style="margin-left:auto" onclick="nuevaCompra()">' + ic('plus', 15) + ' Cargar compra</button>' +
      '</div>' +
      '<div id="cont-compras"></div>';
    pintarCompras();
  }
});

function itemsCompra(c) {
  try { return typeof c.items === 'string' ? JSON.parse(c.items || '[]') : (c.items || []); }
  catch (e) { return []; }
}
function costoCompra(c) { return +c.total_costo || +c.total || 0; }

function pintarCompras() {
  var lista = _compras.filter(function (c) { return claveMes(c.fecha || c.created_at) === _mesCompra; });
  var costo = lista.reduce(function (s, c) { return s + costoCompra(c); }, 0);
  var unidades = lista.reduce(function (s, c) { return s + (+c.total_unidades || 0); }, 0);

  porId('cont-compras').innerHTML =
    '<div class="grilla-stats" style="margin-bottom:14px">' +
      stat('cart', 'Costo del mes', plata(costo), plural(lista.length, 'compra'), 'var(--violet)') +
      stat('box', 'Unidades', String(unidades), unidades && costo ? 'costo unitario ' + plata(costo / unidades) : '', 'var(--text2)') +
    '</div>' +
    (lista.length
      ? '<div class="lista">' + lista.map(function (c) {
          var its = itemsCompra(c);
          return '<div class="fila" style="cursor:default;align-items:flex-start">' +
            '<div class="fila-principal">' +
              '<div class="fila-titulo">' + esc(capitalizar(c.tipo || 'compra')) + ' · ' + esc(fechaCorta(c.fecha)) + '</div>' +
              '<div class="fila-sub">' +
                (its.length
                  ? its.map(function (i) { return esc(i.prod || i.cat) + (i.color ? ' ' + esc(i.color) : '') + ' ×' + (+i.cant || 0); }).join(' · ')
                  : '—') +
                (c.notas ? '<br>' + esc(c.notas) : '') +
              '</div>' +
            '</div>' +
            '<div class="fila-derecha">' +
              '<div class="fila-titulo">' + plata(costoCompra(c)) + '</div>' +
              '<div class="stat-sub">' + plural(+c.total_unidades || 0, 'unidad', 'unidades') + '</div>' +
            '</div>' +
          '</div>';
        }).join('') + '</div>'
      : vacio('cart', 'Sin compras este mes', 'Cuando cargues una, aparece acá con su costo.'));
}

function nuevaCompra() {
  abrirModal('Cargar compra',
    '<div class="campo"><div class="campo-etiq">Producto</div>' +
      '<input class="campo-input" id="c-prod" placeholder="Ej: Esmalte En Gel"/></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
      '<div class="campo"><div class="campo-etiq">Unidades</div>' +
        '<input class="campo-input" id="c-cant" type="number" inputmode="numeric" min="0"/></div>' +
      '<div class="campo"><div class="campo-etiq">Costo por unidad</div>' +
        '<input class="campo-input" id="c-costo" type="number" inputmode="decimal" min="0" oninput="previewCompra()"/></div>' +
    '</div>' +
    '<div class="campo"><div class="campo-etiq">Fecha</div>' +
      '<input class="campo-input" id="c-fecha" value="' + hoyTexto() + '"/></div>' +
    '<div class="campo" style="margin:0"><div class="campo-etiq">Nota (opcional)</div>' +
      '<input class="campo-input" id="c-notas" oninput="previewCompra()"/></div>' +

function previewCompra() {
  var cant = +porId('c-cant').value || 0;
  var costo = +porId('c-costo').value || 0;

}

async function guardarCompra() {
  var prod = (porId('c-prod').value || '').trim();

  var costo = +porId('c-costo').value || 0;

    await crear('compras', {
      fecha: (porId('c-fecha').value || hoyTexto()).trim(),
      tipo: 'pedido',
      items: JSON.stringify([{ cat: 'esmalte', prod: prod, color: '', cant: cant, costo: costo }]),
      total_unidades: cant,
      total_costo: cant * costo,
      notas: (porId('c-notas').value || '').trim() || null,
      created_at: new Date().toISOString()
    });

</script>
<script>

   GASTOS — carga rápida y corte por mes.
   ═══════════════════════════════════════════════════════════ */

var CAT_GASTO = ['combustible','impuestos','insumos','mantenimiento','sueldos','otro'];
var _gastos = [], _mesGasto = '';

registrarPagina({
  id: 'gastos',
  menu: 'Gastos',
  grupo: 'Plata',
  icono: 'wallet',
  titulo: 'Gastos',

});

function pintarGastos() {
  var lista = _gastos.filter(function (g) { return claveMes(g.fecha || g.created_at) === _mesGasto; });

  var porCat = {};
  lista.forEach(function (g) { porCat[g.categoria || 'otro'] = (porCat[g.categoria || 'otro'] || 0) + (+g.monto || 0); });

  porId('cont-gastos').innerHTML =
    '<div class="grilla-stats" style="margin-bottom:14px">' +
      stat('wallet', 'Total del mes', plata(total), plural(lista.length, 'gasto'), 'var(--danger)') +
      Object.keys(porCat).sort(function (a, b) { return porCat[b] - porCat[a]; }).slice(0, 3).map(function (c) {
        return stat('tag', capitalizar(c), plata(porCat[c]), '', 'var(--text2)');
      }).join('') +
    '</div>' +
    (lista.length
      ? '<div class="lista">' + lista.map(function (g) {
          return '<div class="fila" style="cursor:default">' +
            '<div class="fila-principal">' +
              '<div class="fila-titulo">' + esc(g.descripcion || '—') + '</div>' +
              '<div class="fila-sub">' + esc(fechaCorta(g.fecha)) + ' · ' + esc(capitalizar(g.categoria || 'otro')) +
                (g.notas ? ' · ' + esc(g.notas) : '') + '</div>' +
            '</div>' +
            '<div class="fila-derecha"><div class="fila-titulo">' + plata(g.monto) + '</div></div>' +
          '</div>';
        }).join('') + '</div>'
      : vacio('wallet', 'Sin gastos este mes', 'Cargá el primero para que aparezca acá.'));

function nuevoGasto() {
  abrirModal('Cargar gasto',
    '<div class="campo"><div class="campo-etiq">Descripción</div>' +
      '<input class="campo-input" id="g-desc" placeholder="Ej: nafta Scenic"/></div>' +
    '<div class="campo"><div class="campo-etiq">Monto</div>' +
      '<input class="campo-input" id="g-monto" type="number" inputmode="decimal" min="0" placeholder="0"/></div>' +
    '<div class="campo"><div class="campo-etiq">Categoría</div>' +
      '<select class="campo-input" id="g-cat">' +
        CAT_GASTO.map(function (c) { return '<option value="' + c + '">' + capitalizar(c) + '</option>'; }).join('') +
      '</select></div>' +
    '<div class="campo"><div class="campo-etiq">Fecha</div>' +
      '<input class="campo-input" id="g-fecha" value="' + hoyTexto() + '"/></div>' +
    '<div class="campo" style="margin:0"><div class="campo-etiq">Nota (opcional)</div>' +
      '<input class="campo-input" id="g-notas"/></div>',
    '<button class="btn btn-primario btn-bloque" onclick="guardarGasto()">Guardar gasto</button>');
}

async function guardarGasto() {
  var monto = +porId('g-monto').value || 0;
  var desc = (porId('g-desc').value || '').trim();
  if (!desc) { toast('Escribí una descripción', 'error'); return; }
  if (monto <= 0) { toast('El monto tiene que ser mayor a cero', 'error'); return; }
  try {
    await crear('gastos', {
      descripcion: desc, monto: monto,
      categoria: porId('g-cat').value,
      fecha: (porId('g-fecha').value || hoyTexto()).trim(),
      notas: (porId('g-notas').value || '').trim() || null,
      created_at: new Date().toISOString()
    });
    cerrarModal();
    toast('Gasto guardado');
    pintarRuta();
  } catch (e) { toast(e.message, 'error'); }
}

/* Selector de mes compartido por Gastos, Compras y Métricas */
function selectorMes(nombreVar, filas, alCambiar) {
  var meses = {};
  (filas || []).forEach(function (f) {
    var m = claveMes(f.fecha || f.created_at);
    if (m) meses[m] = 1;
  });
  meses[claveMes(hoyTexto())] = 1;
  var ordenados = Object.keys(meses).sort().reverse();
  return '<select class="campo-input" style="width:auto" onchange="' + nombreVar + '=this.value;' + alCambiar + '()">' +
    ordenados.map(function (m) {
      var p = m.split('-');
      var sel = window[nombreVar] === m ? ' selected' : '';
      return '<option value="' + m + '"' + sel + '>' + capitalizar(MESES[+p[1] - 1]) + ' ' + p[0] + '</option>';
    }).join('') + '</select>';
}

</script>
<script>
/* ══ js/paginas/metricas.js ══ */
/* ═══════════════════════════════════════════════════════════
   MÉTRICAS — el mes elegido, de dónde salió la plata y a dónde
   se fue. Todo se calcula de los remitos: no hay ningún total
   guardado aparte que se pueda desincronizar.
   ═══════════════════════════════════════════════════════════ */

var _mesMetricas = '';
var _datosMetricas = null;

registrarPagina({
  id: 'metricas',
  menu: 'Métricas',
  grupo: 'Plata',
  icono: 'chart',
  titulo: 'Métricas',
  subtitulo: 'Cómo viene el mes',

  async montar(cont) {
    var r = await Promise.all([traerCacheado('remitos'), traerCacheado('gastos'), traerCacheado('compras')]);
    _datosMetricas = { remitos: r[0], gastos: r[1], compras: r[2] };
    if (!_mesMetricas) _mesMetricas = claveMes(hoyTexto());

    cont.innerHTML =
      '<div style="margin-bottom:14px">' + selectorMes('_mesMetricas', r[0], 'pintarMetricas') + '</div>' +
      '<div id="cont-metricas"></div>';
    pintarMetricas();
  }
});

function pintarMetricas() {
  var d = _datosMetricas;
  var delMes = function (f) { return claveMes(f.fecha || f.created_at) === _mesMetricas; };

  var remitos = d.remitos.filter(delMes).filter(function (r) { return r.motivo !== 'cerrado'; });
  var cerrados = d.remitos.filter(delMes).filter(function (r) { return r.motivo === 'cerrado'; });
  var gastos = d.gastos.filter(delMes).reduce(function (s, g) { return s + (+g.monto || 0); }, 0);
  var compras = d.compras.filter(delMes).reduce(function (s, c) { return s + (+c.total_costo || +c.total || 0); }, 0);

  var res = resumirRemitos(remitos);
  var neto = res.facturado - gastos - compras;

  /* Clientes del mes, ordenados por lo que facturaron */
  var porCliente = {};
  remitos.forEach(function (r) {
    var n = r.cliente_nombre || 'Sin cliente';
    var c = porCliente[n] = porCliente[n] || { n: n, remitos: 0, facturado: 0, deuda: 0 };
    c.remitos++; c.facturado += (+r.total || 0); c.deuda += montoPorTipo(r, 'deuda');
  });
  var ranking = Object.keys(porCliente).map(function (k) { return porCliente[k]; })
    .sort(function (a, b) { return b.facturado - a.facturado; });

  /* Días con actividad */
  var porDia = {};
  remitos.forEach(function (r) { var k = claveFecha(r.fecha || r.created_at); if (k) porDia[k] = (porDia[k] || 0) + 1; });
  var dias = Object.keys(porDia).sort();

  porId('cont-metricas').innerHTML =
    '<div class="grilla-stats">' +
      stat('receipt', 'Facturado', plata(res.facturado), plural(res.cantidad, 'remito'), 'var(--rose)') +
      stat('cash', 'Efectivo', plata(res.efectivo), '', 'var(--ok)') +
      stat('smartphone', 'Transferencia', plata(res.transferencia), '', 'var(--info)') +
      stat('clock', 'Deuda pendiente', plata(res.deuda), '', 'var(--warn)') +
      stat('wallet', 'Gastos', plata(gastos), '', 'var(--danger)') +
      stat('cart', 'Compras', plata(compras), '', 'var(--violet)') +
      stat('chart', 'Neto', plata(neto), 'facturado − gastos − compras', neto >= 0 ? 'var(--ok)' : 'var(--danger)') +
      stat('box', 'Unidades', String(res.unidades), res.cantidad ? Math.round(res.unidades / res.cantidad) + ' por remito' : '', 'var(--text2)') +
    '</div>' +

    (cerrados.length
      ? avisoHTML('warn', plural(cerrados.length, 'visita') + ' a clientes que estaban cerrados. No suman a lo facturado.', 'ban')
      : '') +

    '<div class="eyebrow" style="margin-top:26px">Actividad</div>' +
    '<div class="tarjeta"><div class="tarjeta-cuerpo">' +
      (dias.length
        ? '<div style="display:flex;align-items:flex-end;gap:3px;height:90px">' +
            dias.map(function (k) {
              var n = porDia[k];
              var max = Math.max.apply(null, dias.map(function (x) { return porDia[x]; }));
              var alto = Math.max(6, Math.round(n / max * 84));
              return '<div title="' + esc(fechaCorta(k)) + ': ' + plural(n, 'remito') + '" ' +
                'style="flex:1;height:' + alto + 'px;background:var(--grad);border-radius:3px 3px 0 0;min-width:4px"></div>';
            }).join('') +
          '</div>' +
          '<div class="campo-ayuda" style="margin-top:8px">' +
            plural(dias.length, 'día') + ' con actividad · ' +
            'promedio ' + Math.round(res.cantidad / dias.length) + ' remitos por día' +
          '</div>'
        : '<div class="campo-ayuda">Todavía no hay remitos este mes.</div>') +
    '</div></div>' +

    '<div class="eyebrow" style="margin-top:26px">Clientes del mes</div>' +
    (ranking.length
      ? '<div class="tarjeta"><div class="tarjeta-cuerpo" style="padding:0">' +
          '<table class="tabla"><thead><tr>' +
            '<th>Cliente</th><th class="num">Remitos</th><th class="num">Facturado</th><th class="num">Deuda</th>' +
          '</tr></thead><tbody>' +
          ranking.slice(0, 25).map(function (c) {
            return '<tr><td>' + esc(c.n) + '</td>' +
              '<td class="num">' + c.remitos + '</td>' +
              '<td class="num">' + plata(c.facturado) + '</td>' +
              '<td class="num" style="color:' + (c.deuda > 0 ? 'var(--warn)' : 'var(--muted)') + '">' +
                (c.deuda > 0 ? plata(c.deuda) : '—') + '</td></tr>';
          }).join('') +
          '</tbody></table>' +
        '</div></div>'
      : vacio('users', 'Sin clientes este mes', 'Cuando cargues remitos, el ranking aparece acá.'));
}

</script>

      tarjetaConexion() +

        '<div class="tarjeta-cuerpo">' +
          '<div class="campo-ayuda" style="margin-bottom:12px">' +
            (MODO_DEV
              ? 'Conectado a producción en modo lectura: se ven los datos reales pero no se guarda nada.'
              : 'Escribiendo en <strong>' + esc(CONEXION.nombre) + '</strong> (' + esc(refProyecto(SB_URL)) + ').') +
          '</div>' +
          '<button class="btn btn-secundario" onclick="invalidarCache();pintarRuta();toast(\'Datos actualizados\')">' +
            ic('refresh', 15) + ' Volver a leer la base</button> ' +
          '<button class="btn btn-secundario" onclick="salir()">' + ic('undo', 15) + ' Cerrar sesión</button>' +
        '</div>' +
      '</div>';

    previewAviso();
    pintarAvisados();

});

function previewAviso() {
  var activo = porId('cfg-activo').checked;
  var nuevo = +porId('cfg-nuevo').value || 0;
  porId('preview-aviso').innerHTML = activo && nuevo
    ? avisoHTML('warn', '<strong>Aviso:</strong> ' + esc(textoAviso(nuevo)), 'megaphone')
    : '<div class="campo-ayuda" style="margin-top:10px">Con el aviso apagado, los remitos salen sin ese texto.</div>';
}

async function guardarAumento() {
  var activo = porId('cfg-activo').checked;
  var producto = (porId('cfg-producto').value || '').trim();
  var viejo = +porId('cfg-viejo').value || 0;
  var nuevo = +porId('cfg-nuevo').value || 0;

  if (activo && (!viejo || !nuevo)) { toast('Cargá los dos precios', 'error'); return; }
  if (activo && !producto) { toast('Escribí qué producto aumenta', 'error'); return; }

  try {
    await guardarConfig(CFG_AUMENTO.activo, activo ? 'true' : 'false');
    await guardarConfig(CFG_AUMENTO.producto, producto);
    await guardarConfig(CFG_AUMENTO.viejo, viejo);
    await guardarConfig(CFG_AUMENTO.nuevo, nuevo);
    toast('Configuración guardada');

/* ── Conexión: a qué base apunta la app ──────────────────── */

        'Proyecto actual: <strong>' + esc(refProyecto(SB_URL)) + '</strong>. ' +
        (ES_PRODUCCION
          ? 'Mientras apunte a producción, la app no escribe nada: solo lee. Para probar cambios de verdad, ' +

async function conectarOtraBase() {
  var url = (porId('cx-url').value || '').trim().replace(/\/+$/, '');
  var key = (porId('cx-key').value || '').trim();
  var nombre = (porId('cx-nombre').value || '').trim() || 'Pruebas';
  var estado = porId('cx-estado');

  if (!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(url)) {
    estado.innerHTML = avisoHTML('danger', 'La URL tiene que ser del tipo <code>https://xxxxxxxx.supabase.co</code>.');
    return;
  }
  if (!claveValida(key)) {
    estado.innerHTML = avisoHTML('danger', 'Esa no parece una clave de Supabase. Copiá entera la <strong>publishable</strong> (empieza con sb_publishable_) o la anon.');
    return;
  }
  if (url === SB_PRODUCCION.url) {
    estado.innerHTML = avisoHTML('warn', 'Esa es la base de producción. Usá el botón de volver a producción.');
    return;
  }

  estado.innerHTML = cargando('Probando la conexión…');
  try {
    var res = await fetch(url + '/rest/v1/config?select=key&limit=1', {
      headers: { apikey: key, Authorization: 'Bearer ' + key }
    });
    var txt = await res.text();
    if (!res.ok) {
      estado.innerHTML = avisoHTML('danger',
        'La base respondió con error ' + res.status + '. ' +
        (res.status === 404 ? 'Falta la tabla <code>config</code>: corré primero el SQL del esquema.'
                            : 'Revisá la clave. Detalle: ' + esc(txt.slice(0, 140))));
      return;
    }
    guardarConexion(url, key, nombre);
    estado.innerHTML = avisoHTML('ok', 'Conectado. Recargando…', 'check');
    setTimeout(function () { location.reload(); }, 700);
  } catch (e) {
    estado.innerHTML = avisoHTML('danger', 'No se pudo llegar a esa URL: ' + esc(e.message));
  }
}

function cambiarA(cual) {
  if (cual === 'produccion') usarProduccion(); else usarPruebas();
  location.reload();
}

</script>

<script>
/* ══ js/app.js ══ */
/* ═══════════════════════════════════════════════════════════
   APP — arranque: pinta el armazón, resuelve la sesión y le
   pasa el control al router.
   ═══════════════════════════════════════════════════════════ */

function pintarMarca(destino) {
  destino.innerHTML =
    '<img src="' + LOGO_INTENCIONAL + '" alt=""/>' +
    '<div>' +
      '<div class="marca-nombre">Intencional</div>' +
      '<div class="marca-sub">Esmaltes · Cremas</div>' +
    '</div>';
}

/* ── Pantalla de ingreso ─────────────────────────────────── */
function pantallaIngreso() {
  porId('app').innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--surface)">' +
      '<div style="width:100%;max-width:360px">' +
        '<div class="marca" id="marca-ingreso" style="border:none;justify-content:center;margin-bottom:22px;padding:0"></div>' +
        '<div class="tarjeta"><div class="tarjeta-cuerpo">' +
          '<div class="campo">' +
            '<div class="campo-etiq">Email</div>' +
            '<input class="campo-input" id="ing-email" type="email" autocomplete="username" placeholder="usuario@intencional.com"/>' +
          '</div>' +
          '<div class="campo">' +
            '<div class="campo-etiq">Contraseña</div>' +
            '<input class="campo-input" id="ing-pass" type="password" autocomplete="current-password" ' +
                   'onkeydown="if(event.key===\'Enter\')entrar()"/>' +
          '</div>' +
          '<button class="btn btn-primario btn-bloque" id="ing-btn" onclick="entrar()">Entrar</button>' +
          (ES_PRODUCCION ? '' :
            '<div class="campo-ayuda" style="margin:14px 0 8px;text-align:center">La base de pruebas no tiene usuarios cargados</div>' +
            '<button class="btn btn-secundario btn-bloque" onclick="arrancarApp()">Entrar sin cuenta</button>') +
          '<div id="ing-error" style="margin-top:12px"></div>' +
        '</div></div>' +
      '</div>' +
    '</div>';
  pintarMarca(porId('marca-ingreso'));
  var e = porId('ing-email'); if (e) e.focus();
}

async function entrar() {
  var btn = porId('ing-btn');
  var email = (porId('ing-email').value || '').trim();
  var pass = porId('ing-pass').value || '';
  var err = porId('ing-error');
  err.innerHTML = '';

  if (!email || !pass) {
    err.innerHTML = avisoHTML('danger', 'Escribí el email y la contraseña.');
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Entrando…';
  try {
    await iniciarSesion(email, pass);
    arrancarApp();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Entrar';
    err.innerHTML = avisoHTML('danger', esc(e.message));
  }
}

async function salir() {
  await cerrarSesion();
  pantallaIngreso();
}

/* ── Armazón ─────────────────────────────────────────────── */
function arrancarApp() {
  porId('app').innerHTML =
    '<div class="velo" onclick="document.body.classList.remove(\'menu-abierto\')"></div>' +
    '<div class="shell">' +
      '<aside class="barra-lateral">' +
        '<div class="marca" id="marca-lateral"></div>' +
        '<nav class="nav" id="nav"></nav>' +
        '<div class="pie-lateral">' +
          '<button class="btn btn-fantasma" style="padding:6px 0" onclick="salir()">' + ic('undo', 15) + ' Cerrar sesión</button>' +
        '</div>' +
      '</aside>' +
      '<main class="contenido">' +
        '<div class="topbar">' +
          '<button class="btn btn-fantasma" style="padding:6px" aria-label="Abrir menú" ' +
                  'onclick="document.body.classList.toggle(\'menu-abierto\')">' + ic('menu', 20) + '</button>' +
          '<div class="marca-nombre">Intencional</div>' +
        '</div>' +
        '<div id="contenido"></div>' +
      '</main>' +
    '</div>';

  pintarMarca(porId('marca-lateral'));
  construirMenu();
  cargarConfig().catch(function () { /* si no hay red, se usa lo local */ });
  pintarRuta();
}

/* ── Arranque ────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', function () {
  if (MODO_DEV || !ES_PRODUCCION) {
    document.body.classList.add('con-banda');
    var b = document.createElement('div');
    b.className = 'banda-dev' + (ES_PRODUCCION ? '' : ' banda-pruebas');
    b.textContent = ES_PRODUCCION
      ? 'Conectado a PRODUCCIÓN en modo lectura · no se guarda nada'
      : 'Base de pruebas (' + refProyecto(SB_URL) + ') · acá sí se guarda';
    document.body.insertBefore(b, document.body.firstChild);
  }

  if (recuperarSesion()) arrancarApp();
  else pantallaIngreso();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('[SW] no se registró:', e.message);
    });
  });
}

</script>
</body>
</html>

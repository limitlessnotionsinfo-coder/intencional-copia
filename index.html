<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#c84b8c"/>
<title>Intencional</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════════════════════
   INTENCIONAL — sistema visual
   Los tokens son los mismos de la app anterior: rosa #c84b8c,
   violeta #9b6bb5, Playfair para los títulos, Inter para el
   cuerpo, Montserrat para lo que tiene que gritar un poco.
   ═══════════════════════════════════════════════════════════ */

:root{
  /* Marca */
  --rose:#c84b8c;
  --rose-light:#fbf2f7;
  --rose-border:rgba(200,75,140,.2);
  --rose-30:rgba(200,75,140,.3);
  --violet:#9b6bb5;
  --grad:linear-gradient(135deg,#9b6bb5,#c84b8c);
  --grad-h:linear-gradient(90deg,#9b6bb5,#c84b8c);

  /* Superficies */
  --bg:#fff;
  --surface:#fafaf8;
  --subtle:#fbf2f7;
  --border:#ede8e8;

  /* Texto */
  --text:#1e1a1a;
  --text2:#5a4e4c;
  --muted:#9c8b88;

  /* Estados */
  --ok:#059669;      --ok-bg:#f0fdf4;      --ok-border:#bbf7d0;
  --info:#2563eb;    --info-bg:#eff6ff;    --info-border:#bfdbfe;
  --warn:#d97706;    --warn-bg:#fff7ed;    --warn-border:#fed7aa;
  --danger:#dc2626;  --danger-bg:#fef2f2;  --danger-border:#fecaca;

  /* Estructura */
  --sidebar-w:220px;
  --radius:12px;
  --radius-lg:16px;
  --radius-sm:8px;
  --sombra:0 1px 2px rgba(30,26,26,.04);
  --sombra-alta:0 8px 24px rgba(180,80,140,.12);

  /* Tipografía */
  --display:'Playfair Display',Georgia,serif;
  --cuerpo:Inter,system-ui,-apple-system,sans-serif;
  --acento:Montserrat,Inter,sans-serif;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--cuerpo);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--rose)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ── Estructura ──────────────────────────────────────────── */
.shell{display:flex;min-height:100vh}

.barra-lateral{
  width:var(--sidebar-w);flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:fixed;inset:0 auto 0 0;z-index:60;
}
.marca{padding:20px 18px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border)}
.marca img{width:38px;height:38px;object-fit:contain;flex-shrink:0}
.marca-nombre{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.2px;line-height:1.1}
.marca-sub{font-size:9px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);margin-top:3px;font-weight:600}

.nav{flex:1;overflow-y:auto;padding:14px 10px}
.nav-grupo{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);padding:14px 10px 6px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 10px;margin-bottom:2px;border:none;background:none;
  border-radius:var(--radius-sm);color:var(--text2);font-size:13.5px;font-weight:500;
  cursor:pointer;text-align:left;transition:background .12s,color .12s;
  -webkit-tap-highlight-color:transparent;
}
.nav-item:hover{background:var(--subtle);color:var(--rose)}
.nav-item[aria-current="page"]{background:var(--subtle);color:var(--rose);font-weight:600}
.nav-item[aria-current="page"] .nav-ic{color:var(--rose)}
.nav-ic{color:var(--muted);display:inline-flex}
.nav-cuenta{margin-left:auto;background:var(--rose);color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:1px 7px}
.pie-lateral{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}

.contenido{flex:1;margin-left:var(--sidebar-w);min-width:0;padding:24px 28px 80px}
.contenido-ancho{max-width:1040px;margin:0 auto}

.topbar{display:none}

/* ── Cabecera de página ──────────────────────────────────── */
.cabecera{margin-bottom:22px}
.cabecera h1{font-family:var(--display);font-size:26px;font-weight:600;margin:0;letter-spacing:.2px}
.cabecera p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.eyebrow{font-family:var(--acento);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.8px;color:var(--muted);margin-bottom:10px}

/* ── Tarjetas ────────────────────────────────────────────── */
.tarjeta{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--sombra);margin-bottom:16px;overflow:hidden}
.tarjeta-cab{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.tarjeta-cuerpo{padding:18px}

/* ── Métricas ────────────────────────────────────────────── */
.grilla-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--sombra)}
.stat-etiq{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px}
.stat-val{font-family:var(--acento);font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.stat-sub{font-size:11px;color:var(--muted);margin-top:3px}

/* ── Botones ─────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border-radius:var(--radius);padding:10px 16px;font-size:13px;font-weight:600;
  border:1px solid transparent;cursor:pointer;transition:filter .12s,border-color .12s,background .12s;
  -webkit-tap-highlight-color:transparent;
}
.btn:disabled{opacity:.55;cursor:default}
.btn-primario{background:var(--grad);color:#fff}
.btn-primario:not(:disabled):hover{filter:brightness(1.06)}
.btn-secundario{background:var(--bg);border-color:var(--border);color:var(--text2)}
.btn-secundario:not(:disabled):hover{border-color:var(--rose-30);color:var(--rose)}
.btn-fantasma{background:none;border-color:transparent;color:var(--muted)}
.btn-fantasma:hover{color:var(--rose)}
.btn-peligro{background:none;border-color:var(--danger-border);color:var(--danger)}
.btn-bloque{width:100%}

/* ── Campos ──────────────────────────────────────────────── */
.campo{margin-bottom:14px}
.campo-etiq{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);margin-bottom:5px}
.campo-input{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 13px;font-size:14px;transition:border-color .12s;
}
.campo-input:focus{outline:none;border-color:var(--rose)}
.campo-input::placeholder{color:var(--muted)}
.campo-ayuda{font-size:11px;color:var(--muted);margin-top:4px}

.buscador{position:relative}
.buscador .ic-lupa{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.buscador input{padding-left:38px}

/* ── Listas ──────────────────────────────────────────────── */
.lista{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--bg)}
.fila{
  display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;
  border:none;border-bottom:1px solid var(--border);background:none;
  text-align:left;cursor:pointer;transition:background .1s;
}
.fila:last-child{border-bottom:none}
.fila:hover{background:var(--subtle)}
.fila-principal{flex:1;min-width:0}
.fila-titulo{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila-sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila-derecha{text-align:right;flex-shrink:0}
.num-cliente{
  font-family:var(--acento);font-size:11px;font-weight:700;color:var(--rose);
  background:var(--subtle);border:1px solid var(--rose-border);border-radius:20px;padding:3px 9px;flex-shrink:0;
}

/* ── Etiquetas de estado ─────────────────────────────────── */
.pin{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:20px;padding:2px 9px;border:1px solid}
.pin-ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-border)}
.pin-info{color:var(--info);background:var(--info-bg);border-color:var(--info-border)}
.pin-warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-border)}
.pin-danger{color:var(--danger);background:var(--danger-bg);border-color:var(--danger-border)}
.pin-neutro{color:var(--muted);background:var(--surface);border-color:var(--border)}

/* ── Avisos ──────────────────────────────────────────────── */
.aviso{display:flex;gap:9px;align-items:flex-start;border:1px solid;border-radius:var(--radius);padding:10px 13px;font-size:12.5px;line-height:1.55;margin-bottom:14px}
.aviso-ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-border)}
.aviso-warn{color:#9a3412;background:var(--warn-bg);border-color:var(--warn-border)}
.aviso-danger{color:#991b1b;background:var(--danger-bg);border-color:var(--danger-border)}

/* ── Estados vacíos y carga ──────────────────────────────── */
.vacio{text-align:center;padding:44px 20px;color:var(--muted)}
.vacio-titulo{font-family:var(--display);font-size:17px;color:var(--text2);margin:10px 0 4px}
.vacio p{font-size:13px;margin:0 0 16px}
.cargando{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;padding:20px 0}
.girador{
  width:15px;height:15px;border:2px solid var(--border);border-top-color:var(--rose);
  border-radius:50%;animation:girar .7s linear infinite;
}
@keyframes girar{to{transform:rotate(360deg)}}

/* ── Toast ───────────────────────────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);
  background:var(--text);color:#fff;border-radius:var(--radius);
  padding:11px 18px;font-size:13px;font-weight:500;z-index:900;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  max-width:calc(100vw - 32px);box-shadow:var(--sombra-alta);
}
.toast.visible{opacity:1;transform:translate(-50%,0)}
.toast.error{background:var(--danger)}

/* ── Banda de modo dev ───────────────────────────────────── */
.banda-dev{
  position:fixed;top:0;left:0;right:0;z-index:800;background:#b45309;color:#fff;
  font-size:11px;font-weight:600;letter-spacing:.4px;text-align:center;padding:4px 8px;
}
body.con-banda .barra-lateral,body.con-banda .contenido{padding-top:22px}

/* ── Responsive ──────────────────────────────────────────── */
@media (max-width:860px){
  .barra-lateral{
    transform:translateX(-100%);transition:transform .2s ease;
    box-shadow:var(--sombra-alta);width:min(260px,80vw);
  }
  body.menu-abierto .barra-lateral{transform:translateX(0)}
  .velo{position:fixed;inset:0;background:rgba(30,26,26,.35);z-index:55;display:none}
  body.menu-abierto .velo{display:block}
  .contenido{margin-left:0;padding:14px 16px 90px}
  .topbar{
    display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);padding:10px 14px;margin:-14px -16px 16px;
  }
  .topbar .marca-nombre{font-size:16px}
  .cabecera h1{font-size:22px}
}

/* ── Modal ───────────────────────────────────────────────── */
.modal{position:fixed;inset:0;background:rgba(30,26,26,.45);z-index:700;display:none;align-items:center;justify-content:center;padding:20px}
.modal.visible{display:flex}
.modal-caja{background:var(--bg);border-radius:var(--radius-lg);width:100%;max-width:440px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--sombra-alta)}
.modal-cab{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-titulo{font-family:var(--display);font-size:17px;font-weight:600}
.modal-cuerpo{padding:18px;overflow-y:auto}
.modal-pie{padding:14px 18px;border-top:1px solid var(--border)}
@media (max-width:860px){
  .modal{align-items:flex-end;padding:0}
  .modal-caja{max-width:none;border-radius:var(--radius-lg) var(--radius-lg) 0 0;max-height:92vh}
}

/* ── Desplegables ────────────────────────────────────────── */
details > summary{list-style:none}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:'⌄';margin-left:8px;color:var(--muted);transition:transform .15s;display:inline-block}
details[open] > summary::after{transform:rotate(180deg)}

/* ── Tabla simple ────────────────────────────────────────── */
.tabla{width:100%;border-collapse:collapse;font-size:13px}
.tabla th{text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border)}
.tabla td{padding:9px 10px;border-bottom:1px solid var(--border)}
.tabla tr:last-child td{border-bottom:none}
.tabla .num{text-align:right;font-variant-numeric:tabular-nums}

/* ── Atajos rápidos del inicio ───────────────────────────── */
.atajos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.atajo{
  display:flex;align-items:center;justify-content:center;gap:9px;
  border-radius:var(--radius);padding:16px 14px;font-size:13.5px;font-weight:700;
  border:1.5px solid transparent;cursor:pointer;transition:filter .12s,border-color .12s,color .12s;
  -webkit-tap-highlight-color:transparent;
}
.atajo:hover{filter:brightness(1.04)}
.atajo-grad{background:var(--grad);color:#fff}
.atajo-violeta{background:var(--violet);color:#fff}
.atajo-rosa{background:var(--bg);border-color:var(--rose);color:var(--rose)}
.atajo-rojo{background:var(--bg);border-color:var(--danger-border);color:var(--danger)}
.atajo-neutro{background:var(--bg);border-color:var(--border);color:var(--text2)}
.atajo-neutro:hover{border-color:var(--rose-30);color:var(--rose)}
/* El último queda solo en la fila: que ocupe todo el ancho */
.atajos .atajo:last-child:nth-child(odd){grid-column:1/-1}

/* Banda de conexión: naranja en producción-lectura, verde en pruebas */
.banda-dev.banda-pruebas{background:#047857}

</style>

<script>
/* ══ js/config.js ══ */
/* ═══════════════════════════════════════════════════════════
   CONEXIÓN — a qué base apunta la app.
   Van con `var` a propósito: quedan como propiedades de window
   y las ve cualquier script, sin depender del orden de carga.
   ═══════════════════════════════════════════════════════════ */

/* La base de producción, la que está en uso todos los días. */
var SB_PRODUCCION = {
  url: 'https://mcobunyyuahxtjkykfby.supabase.co',
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jb2J1bnl5dWFoeHRqa3lrZmJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDYwODMsImV4cCI6MjA5MTQyMjA4M30.Z4iqz6GsTF5dwU6sdMhIR9OmK8giYHTMiN3iUJEpaEY',
  nombre: 'Producción'
};

/* La base de pruebas: mismo esquema, sin datos reales.
   Acá se escribe sin miedo. */
var SB_PRUEBAS = {
  url: 'https://runlbcwrehbaqcwvzcxs.supabase.co',
  key: 'sb_publishable_9P5b9VpiJyExFJ8-OLtDkg_JjSHJhep',
  nombre: 'Pruebas'
};

/* Si guardaste otra base desde Configuraciones, se usa esa. */
function _conexionGuardada() {
  try {
    var c = JSON.parse(localStorage.getItem('intencional_conexion') || 'null');
    if (c && c.url && c.key) return c;
  } catch (e) {}
  return null;
}

/* Esta build es la de desarrollo: arranca en pruebas.
   Desde Configuraciones se pasa a producción con un botón. */
var CONEXION = _conexionGuardada() || SB_PRUEBAS;
var SB_URL = CONEXION.url;
var SB_KEY = CONEXION.key;

/* El proyecto se identifica por el subdominio: mcob… es producción */
function refProyecto(url) {
  var m = String(url || '').match(/^https:\/\/([a-z0-9]+)\.supabase\.co/);
  return m ? m[1] : '(desconocido)';
}
var ES_PRODUCCION = SB_URL === SB_PRODUCCION.url;

/* El candado de escritura protege la base de producción.
   Contra una base de pruebas se escribe sin restricciones: para
   eso está. */
var MODO_DEV = ES_PRODUCCION;

function guardarConexion(url, key, nombre) {
  localStorage.setItem('intencional_conexion', JSON.stringify({
    url: url.trim().replace(/\/+$/, ''), key: key.trim(), nombre: (nombre || '').trim() || 'Pruebas'
  }));
}
function usarProduccion() {
  guardarConexion(SB_PRODUCCION.url, SB_PRODUCCION.key, SB_PRODUCCION.nombre);
}
function usarPruebas() {
  localStorage.removeItem('intencional_conexion');
}
/* Una clave sirve si es publishable (sb_publishable_…) o un JWT anon */
function claveValida(k) {
  k = String(k || '').trim();
  return /^sb_publishable_[A-Za-z0-9_\-]{10,}$/.test(k) || k.split('.').length === 3;
}

/* Tablas y su clave primaria */
var TABLAS = {
  clientes:         'num',
  remitos:          'id',
  pagos:            'id',
  gastos:           'id',
  compras:          'id',
  pedidos:          'id',
  pedidos_propios:  'id',
  stock:            'id',
  stock_categorias: 'id',
  tareas:           'id',
  config:           'key'
};

</script>

<div id="app"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script>

<script>
/* ══ js/ui.js ══ */
/* ═══════════════════════════════════════════════════════════
   UI — helpers que usa todo el resto: escapado, formatos,
   toast, atajos de DOM. Sin dependencias.
   ═══════════════════════════════════════════════════════════ */

/* ── DOM ─────────────────────────────────────────────────── */
function $(sel, raiz) { return (raiz || document).querySelector(sel); }
function $$(sel, raiz) { return Array.prototype.slice.call((raiz || document).querySelectorAll(sel)); }
function porId(id) { return document.getElementById(id); }

/* ── Escapado: TODO lo que venga de la base pasa por acá ─── */
function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ── Plata ───────────────────────────────────────────────── */
function plata(n) {
  return '$' + (+n || 0).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
function plataCorta(n) {
  var v = +n || 0;
  if (Math.abs(v) >= 1000000) return '$' + (v / 1000000).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + 'M';
  if (Math.abs(v) >= 10000)   return '$' + Math.round(v / 1000) + 'k';
  return plata(v);
}

/* ── Fechas ──────────────────────────────────────────────────
   La base guarda las fechas de remitos/gastos como texto en
   dd/mm/aa. Estas funciones aguantan ese formato, el de cuatro
   dígitos y el ISO, sin romperse con ninguno.
   ────────────────────────────────────────────────────────── */
function hoyTexto() {
  var d = new Date();
  return dosDig(d.getDate()) + '/' + dosDig(d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(2);
}
function hoyISO() {
  var d = new Date();
  return d.getFullYear() + '-' + dosDig(d.getMonth() + 1) + '-' + dosDig(d.getDate());
}
function dosDig(n) { return String(n).padStart(2, '0'); }

/* Devuelve {a,m,d} o null. Acepta 2026-08-02, 02/08/26 y 02/08/2026 */
function partesFecha(valor) {
  if (!valor) return null;
  var s = String(valor).trim();
  var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return { a: +m[1], m: +m[2], d: +m[3] };
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (m) {
    var a = m[3].length === 2 ? 2000 + (+m[3]) : +m[3];
    return { a: a, m: +m[2], d: +m[1] };
  }
  return null;
}
/* Clave ordenable aaaa-mm-dd; sirve para comparar y agrupar */
function claveFecha(valor) {
  var p = partesFecha(valor);
  return p ? p.a + '-' + dosDig(p.m) + '-' + dosDig(p.d) : '';
}
function claveMes(valor) {
  var p = partesFecha(valor);
  return p ? p.a + '-' + dosDig(p.m) : '';
}
function fechaCorta(valor) {
  var p = partesFecha(valor);
  return p ? dosDig(p.d) + '/' + dosDig(p.m) + '/' + String(p.a).slice(2) : '';
}
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function fechaLarga(valor) {
  var p = partesFecha(valor);
  return p ? p.d + ' de ' + MESES[p.m - 1] + ' de ' + p.a : '';
}
function diasEntre(desde, hasta) {
  var a = partesFecha(desde), b = partesFecha(hasta);
  if (!a || !b) return null;
  var ms = Date.UTC(b.a, b.m - 1, b.d) - Date.UTC(a.a, a.m - 1, a.d);
  return Math.round(ms / 86400000);
}

/* ── Texto ───────────────────────────────────────────────── */
/* Normaliza para buscar: sin tildes, sin mayúsculas, sin dobles espacios */
function normalizar(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function plural(n, singular, plural_) {
  return n + ' ' + (n === 1 ? singular : (plural_ || singular + 's'));
}

/* Booleano tolerante: Postgres devuelve true/false, pero un CSV
   reimportado o un jsonb pueden traer "false" como texto, que en
   JavaScript es verdadero. Todo lo que sea booleano pasa por acá. */
function bool(v) {
  if (v === true) return true;
  if (v === false || v === null || v === undefined) return false;
  var s = String(v).trim().toLowerCase();
  return s === 'true' || s === 't' || s === '1' || s === 'si' || s === 'sí';
}

/* ── Toast ───────────────────────────────────────────────── */
var _toastTimer = null;
function toast(mensaje, tipo) {
  var el = porId('toast');
  if (!el) return;
  el.textContent = mensaje;
  el.className = 'toast visible' + (tipo === 'error' ? ' error' : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function () { el.className = 'toast'; }, tipo === 'error' ? 4200 : 2600);
}

/* ── Bloques reutilizables ───────────────────────────────── */
function cargando(texto) {
  return '<div class="cargando"><span class="girador"></span>' + esc(texto || 'Cargando…') + '</div>';
}
function vacio(icono, titulo, texto, accionHTML) {
  return '<div class="vacio">' + ic(icono, 30) +
    '<div class="vacio-titulo">' + esc(titulo) + '</div>' +
    (texto ? '<p>' + esc(texto) + '</p>' : '') +
    (accionHTML || '') + '</div>';
}
function avisoHTML(tipo, contenidoHTML, icono) {
  return '<div class="aviso aviso-' + tipo + '">' + ic(icono || 'alert', 15) +
    '<div>' + contenidoHTML + '</div></div>';
}

/* ── Modal ───────────────────────────────────────────────── */
function abrirModal(titulo, cuerpoHTML, pieHTML) {
  var m = porId('modal');
  m.innerHTML =
    '<div class="modal-caja" role="dialog" aria-modal="true" aria-label="' + esc(titulo) + '">' +
      '<div class="modal-cab">' +
        '<div class="modal-titulo">' + esc(titulo) + '</div>' +
        '<button class="btn btn-fantasma" style="padding:2px 6px" aria-label="Cerrar" onclick="cerrarModal()">✕</button>' +
      '</div>' +
      '<div class="modal-cuerpo">' + cuerpoHTML + '</div>' +
      (pieHTML ? '<div class="modal-pie">' + pieHTML + '</div>' : '') +
    '</div>';
  m.className = 'modal visible';
  document.body.style.overflow = 'hidden';
  var primero = m.querySelector('input,select,textarea,button');
  if (primero) primero.focus();
}

function cerrarModal() {
  var m = porId('modal');
  m.className = 'modal';
  m.innerHTML = '';
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') cerrarModal();
});

</script>
<script>
/* ══ js/api.js ══ */
/* ═══════════════════════════════════════════════════════════
   API — única puerta de entrada a Supabase.
   Ninguna página llama a fetch por su cuenta: todo pasa por acá,
   así el candado de MODO_DEV, la paginación y el manejo de
   errores viven en un solo lugar.
   ═══════════════════════════════════════════════════════════ */

var TOPE_PAGINA = 1000;   // tope que impone PostgREST por request
var _sesion = null;       // sesión de Supabase Auth
var _cache = {};          // { tabla: {datos, ts} }
var TTL_CACHE = 15000;    // 15 s: evita ráfagas de pedidos iguales

/* ── Sesión ──────────────────────────────────────────────── */
function sesionActual() { return _sesion; }
function tokenActual() { return (_sesion && _sesion.access_token) || SB_KEY; }

function guardarSesion(s) {
  _sesion = s;
  try { localStorage.setItem('intencional_sesion', JSON.stringify(s)); } catch (e) {}
}
function recuperarSesion() {
  try {
    var s = JSON.parse(localStorage.getItem('intencional_sesion') || 'null');
    if (s && s.access_token) { _sesion = s; return s; }
  } catch (e) {}
  return null;
}
function borrarSesion() {
  _sesion = null;
  try { localStorage.removeItem('intencional_sesion'); } catch (e) {}
}

async function authFetch(ruta, opciones) {
  if (typeof SB_URL === 'undefined') {
    throw new Error('Falta config.js. Recargá la página con Ctrl/Cmd + Shift + R.');
  }
  var res = await fetch(SB_URL + '/auth/v1/' + ruta, Object.assign({
    headers: Object.assign({ apikey: SB_KEY, 'Content-Type': 'application/json' }, opciones && opciones.headers)
  }, opciones));
  var txt = await res.text();
  var data = txt ? JSON.parse(txt) : {};
  if (!res.ok) throw new Error(data.error_description || data.msg || data.error || 'No se pudo iniciar sesión');
  return data;
}

async function iniciarSesion(email, contrasena) {
  var d = await authFetch('token?grant_type=password', {
    method: 'POST',
    body: JSON.stringify({ email: email, password: contrasena })
  });
  guardarSesion(d);
  return d;
}

async function cerrarSesion() {
  try {
    if (_sesion) {
      await authFetch('logout', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + _sesion.access_token }
      });
    }
  } catch (e) { /* si falla, igual cerramos del lado del navegador */ }
  borrarSesion();
  _cache = {};
}

/* ── REST ────────────────────────────────────────────────── */
var ESCRITURAS = { POST: 1, PATCH: 1, PUT: 1, DELETE: 1 };

async function rest(ruta, opciones) {
  opciones = opciones || {};
  var metodo = (opciones.method || 'GET').toUpperCase();

  if (MODO_DEV && ESCRITURAS[metodo]) {
    console.warn('[MODO DEV] Escritura bloqueada: ' + metodo + ' ' + ruta);
    toast('Modo dev: no se guardó nada en la base', 'error');
    return [];
  }

  var ctrl = new AbortController();
  var corte = setTimeout(function () { ctrl.abort(); }, opciones.timeout || 20000);
  try {
    var res = await fetch(SB_URL + '/rest/v1/' + ruta, {
      method: metodo,
      signal: ctrl.signal,
      body: opciones.body,
      headers: Object.assign({
        apikey: SB_KEY,
        Authorization: 'Bearer ' + tokenActual(),
        'Content-Type': 'application/json',
        Prefer: 'return=representation'
      }, opciones.headers || {})
    });
    clearTimeout(corte);
    var txt = await res.text();
    if (!res.ok) throw new Error(mensajeDeError(res.status, txt));
    return txt ? JSON.parse(txt) : [];
  } catch (e) {
    clearTimeout(corte);
    if (e.name === 'AbortError') throw new Error('La base tardó demasiado en responder. Revisá la conexión.');
    throw e;
  }
}

/* Traduce el error crudo de PostgREST a algo que se pueda leer */
function mensajeDeError(status, txt) {
  var d = {};
  try { d = JSON.parse(txt); } catch (e) {}
  if (status === 401 || status === 403) return 'La sesión venció. Volvé a entrar.';
  if (d.message && /column .* does not exist/.test(d.message)) {
    return 'Falta una columna en la base: ' + d.message + '. ¿Corriste el SQL?';
  }
  return d.message || d.hint || ('Error ' + status);
}

/* ── Lecturas ────────────────────────────────────────────── */
/* Trae una tabla entera paginando. Sin esto, cualquier consulta
   se corta en 1000 filas y el error pasa desapercibido. */
async function traerTodo(tabla, consulta) {
  var pk = TABLAS[tabla] || 'id';
  var filas = [], offset = 0;
  for (;;) {
    var q = tabla + '?select=*' + (consulta ? '&' + consulta : '') +
            '&order=' + encodeURIComponent(pk) + '.asc' +
            '&limit=' + TOPE_PAGINA + '&offset=' + offset;
    var lote = await rest(q);
    filas = filas.concat(lote);
    if (lote.length < TOPE_PAGINA) break;
    offset += TOPE_PAGINA;
    if (offset > 200000) break;   // freno de seguridad
  }
  return filas;
}

/* Igual que traerTodo pero con caché corta, para las pantallas
   que piden la misma tabla varias veces seguidas */
async function traerCacheado(tabla, consulta) {
  var clave = tabla + '|' + (consulta || '');
  var c = _cache[clave];
  if (c && (Date.now() - c.ts) < TTL_CACHE) return c.datos;
  var datos = await traerTodo(tabla, consulta);
  _cache[clave] = { datos: datos, ts: Date.now() };
  return datos;
}

function invalidarCache(tabla) {
  if (!tabla) { _cache = {}; return; }
  Object.keys(_cache).forEach(function (k) {
    if (k.indexOf(tabla + '|') === 0) delete _cache[k];
  });
}

/* ── Escrituras ──────────────────────────────────────────── */
async function crear(tabla, fila) {
  var r = await rest(tabla, { method: 'POST', body: JSON.stringify(fila) });
  invalidarCache(tabla);
  return r;
}

async function actualizar(tabla, valorPk, cambios) {
  var pk = TABLAS[tabla] || 'id';
  var r = await rest(tabla + '?' + pk + '=eq.' + encodeURIComponent(valorPk), {
    method: 'PATCH', body: JSON.stringify(cambios)
  });
  invalidarCache(tabla);
  return r;
}

async function borrar(tabla, valorPk) {
  var pk = TABLAS[tabla] || 'id';
  var r = await rest(tabla + '?' + pk + '=eq.' + encodeURIComponent(valorPk), { method: 'DELETE' });
  invalidarCache(tabla);
  return r;
}

/* ── Config (tabla key/value) ────────────────────────────── */
var _config = null;

async function cargarConfig() {
  if (_config) return _config;
  var filas = await traerTodo('config');
  _config = {};
  filas.forEach(function (f) { _config[f.key] = f.value; });
  return _config;
}

function leerConfig(clave, pordefecto) {
  if (_config && _config[clave] !== undefined && _config[clave] !== null) return _config[clave];
  try {
    var v = localStorage.getItem('cfg_' + clave);
    if (v !== null) return v;
  } catch (e) {}
  return pordefecto;
}

async function guardarConfig(clave, valor) {
  try { localStorage.setItem('cfg_' + clave, String(valor)); } catch (e) {}
  if (_config) _config[clave] = String(valor);
  await rest('config', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates' },
    body: JSON.stringify({ key: clave, value: String(valor) })
  });
  invalidarCache('config');
}

</script>
<script>
/* ══ js/dominio.js ══ */
/* ═══════════════════════════════════════════════════════════
   DOMINIO — las reglas del negocio, separadas de la pantalla.
   Acá vive la única verdad sobre cómo se reparte el pago de un
   remito, que es de donde salen TODAS las métricas.
   ═══════════════════════════════════════════════════════════ */

var TIPOS_PAGO = {
  efectivo:      { etiqueta: 'Efectivo',      corta: 'Efectivo',      color: '#059669', icono: 'cash' },
  transferencia: { etiqueta: 'Transferencia', corta: 'Transferencia', color: '#2563eb', icono: 'smartphone' },
  deuda:         { etiqueta: 'Deuda pendiente', corta: 'Deuda',       color: '#d97706', icono: 'clock' },
  sin_definir:   { etiqueta: 'Sin definir',   corta: 'Sin definir',   color: '#9c8b88', icono: 'alert' }
};

/* ── Partes de pago de un remito ──────────────────────────────
   Hay dos modelos conviviendo en la base:
   · nuevo → columna pagos_detalle, un array de partes
   · viejo → columnas pago / pago2_tipo / pago2_monto
   Un mismo remito puede sumar a efectivo y a deuda a la vez.
   ────────────────────────────────────────────────────────── */
function partesPago(r) {
  if (!r) return [];

  if (r.pagos_detalle) {
    try {
      var arr = typeof r.pagos_detalle === 'string' ? JSON.parse(r.pagos_detalle) : r.pagos_detalle;
      if (Array.isArray(arr) && arr.length) {
        return arr.map(function (p) {
          return {
            tipo: p.tipo || 'sin_definir',
            monto: +p.monto || 0,
            alias: p.alias || null,
            eraDeuda: bool(p.era_deuda),
            saldadoFecha: p.saldado_fecha || null,
            deudaVieja: false
          };
        });
      }
    } catch (e) { /* si el JSON está roto, cae al modelo viejo */ }
  }

  var total = +r.total || 0;
  var m2 = +r.pago2_monto || 0;
  var partes = [];
  if (r.pago2_tipo && m2 > 0 && m2 < total) {
    partes.push({ tipo: r.pago || 'sin_definir', monto: total - m2, alias: r.alias || null,
                  eraDeuda: false, saldadoFecha: r.saldado_fecha || null, deudaVieja: bool(r.saldado) });
    partes.push({ tipo: r.pago2_tipo, monto: m2, alias: r.pago2_alias || null,
                  eraDeuda: false, saldadoFecha: null, deudaVieja: false });
  } else {
    partes.push({ tipo: r.pago || 'sin_definir', monto: total, alias: r.alias || null,
                  eraDeuda: false, saldadoFecha: r.saldado_fecha || null, deudaVieja: bool(r.saldado) });
  }
  return partes;
}

/* Cuánto de un remito corresponde a un tipo de pago */
function montoPorTipo(r, tipo) {
  return partesPago(r).reduce(function (s, p) {
    if (p.tipo !== tipo) return s;
    if (tipo === 'deuda' && p.deudaVieja) return s;   // deuda vieja ya saldada
    return s + p.monto;
  }, 0);
}

function deudaPendiente(r)   { return montoPorTipo(r, 'deuda'); }
function tieneDeuda(r)       { return deudaPendiente(r) > 0; }
function esPagoMixto(r)      { return partesPago(r).filter(function (p) { return p.monto > 0; }).length > 1; }
function sumarTipo(lista, tipo) {
  return (lista || []).reduce(function (s, r) { return s + montoPorTipo(r, tipo); }, 0);
}

/* Etiqueta corta para listados */
function pagoHTML(r) {
  var partes = partesPago(r).filter(function (p) { return p.monto > 0; });
  if (!partes.length) return '<span class="pin pin-neutro">—</span>';
  return partes.map(function (p) {
    var t = TIPOS_PAGO[p.tipo] || TIPOS_PAGO.sin_definir;
    if (p.tipo === 'deuda' && p.deudaVieja) return '<span class="pin pin-ok">' + ic('check', 12) + ' Saldada</span>';
    var clase = p.tipo === 'deuda' ? 'pin-warn' : p.tipo === 'efectivo' ? 'pin-ok' : p.tipo === 'transferencia' ? 'pin-info' : 'pin-neutro';
    return '<span class="pin ' + clase + '">' + ic(t.icono, 12) + ' ' + esc(t.corta) +
           (partes.length > 1 ? ' ' + plata(p.monto) : '') + '</span>';
  }).join(' ');
}

/* ── Resumen de un conjunto de remitos ───────────────────── */
function resumirRemitos(remitos) {
  var r = {
    cantidad: remitos.length,
    unidades: 0,
    facturado: 0,
    efectivo: 0,
    transferencia: 0,
    deuda: 0
  };
  remitos.forEach(function (x) {
    r.unidades      += (+x.unidades || 0);
    r.facturado     += (+x.total || 0);
    r.efectivo      += montoPorTipo(x, 'efectivo');
    r.transferencia += montoPorTipo(x, 'transferencia');
    r.deuda         += montoPorTipo(x, 'deuda');
  });
  return r;
}

/* ── Clientes ────────────────────────────────────────────── */
/* Un cliente entra en la búsqueda por número, nombre, zona o
   dirección. Es la búsqueda que se usa en toda la app. */
function coincideCliente(c, termino) {
  var t = normalizar(termino);
  if (!t) return true;
  return normalizar(c.local).indexOf(t) !== -1 ||
         normalizar(c.num_str).indexOf(t) !== -1 ||
         String(c.num || '').indexOf(t) !== -1 ||
         normalizar(c.loc).indexOf(t) !== -1 ||
         normalizar(c.dir).indexOf(t) !== -1 ||
         normalizar(c.duenio).indexOf(t) !== -1;
}

/* Número de ruta guardado en la columna jsonb `ruta` */
function rutaDe(c) {
  if (!c || !c.ruta) return '';
  try {
    var r = typeof c.ruta === 'string' ? JSON.parse(c.ruta) : c.ruta;
    return (r && r.orden) ? String(r.orden) : '';
  } catch (e) { return ''; }
}

function clienteActivo(c) { return c.activo === undefined || c.activo === null || bool(c.activo); }

/* ═══════════════════════════════════════════════════════════
   PRECIOS Y AUMENTO
   La lista de precios sale de la tabla `stock`. El aumento tiene
   dos tramos: el precio viejo se le cobra a quien todavía no fue
   notificado, el nuevo a quien ya lo fue.
   ═══════════════════════════════════════════════════════════ */

var CFG_AUMENTO = {
  activo:  'aumento_activo',
  producto:'aumento_producto',
  viejo:   'aumento_precio_viejo',
  nuevo:   'aumento_precio_nuevo'
};

function aumentoConfig() {
  return {
    activo:   leerConfig(CFG_AUMENTO.activo, 'true') === 'true',
    producto: leerConfig(CFG_AUMENTO.producto, 'Esmalte en Gel'),
    viejo:   +leerConfig(CFG_AUMENTO.viejo, 2200) || 0,
    nuevo:   +leerConfig(CFG_AUMENTO.nuevo, 2400) || 0
  };
}

function textoAviso(precio) {
  return 'A partir de la próxima reposición se aplicará un aumento. El nuevo costo será de ' + plata(precio) + '.';
}

function clienteAvisado(c) { return !!c && bool(c.aviso_aumento); }

/* Qué precio le corresponde hoy a este cliente por el producto en aumento */
function precioParaCliente(c) {
  var cfg = aumentoConfig();
  if (!cfg.activo) return null;
  return clienteAvisado(c) ? cfg.nuevo : cfg.viejo;
}

function esProductoEnAumento(nombre) {
  var obj = normalizar(aumentoConfig().producto);
  if (!obj) return false;
  var n = normalizar(nombre);
  return n === obj || n.indexOf(obj) !== -1 || obj.indexOf(n) !== -1;
}

/* Precio de lista de un producto, según la tabla stock */
function precioDeLista(nombre, stock) {
  var item = (stock || []).find(function (s) { return normalizar(s.nombre) === normalizar(nombre) && +s.precio > 0; });
  return item ? +item.precio : 0;
}

/* ── Última reposición ───────────────────────────────────── */
function ultimaReposicion(nombreCliente, remitos) {
  var suyos = (remitos || []).filter(function (r) {
    return normalizar(r.cliente_nombre) === normalizar(nombreCliente) && r.motivo !== 'cerrado';
  });
  if (!suyos.length) return null;
  suyos.sort(function (a, b) { return claveFecha(b.created_at || b.fecha).localeCompare(claveFecha(a.created_at || a.fecha)); });
  var u = suyos[0];
  return {
    remito: u,
    fecha: u.fecha || fechaCorta(u.created_at),
    dias: diasEntre(u.fecha || u.created_at, hoyTexto()),
    total: +u.total || 0,
    unidades: +u.unidades || 0
  };
}

/* ── Pendientes (tabla tareas) ───────────────────────────── */
var TIPOS_PENDIENTE = {
  nuevo:   { etiqueta: 'Cliente nuevo', clase: 'pin-ok',     icono: 'user',  color: 'var(--ok)' },
  pedido:  { etiqueta: 'Pedido',        clase: 'pin-info',   icono: 'bag',   color: 'var(--info)' },
  retirar: { etiqueta: 'A retirar',     clase: 'pin-danger', icono: 'truck', color: 'var(--danger)' },
  otro:    { etiqueta: 'Otro',          clase: 'pin-neutro', icono: 'clipboard', color: 'var(--muted)' }
};
function tipoPendiente(t) { return TIPOS_PENDIENTE[(t && t.tipo) || 'otro'] || TIPOS_PENDIENTE.otro; }

</script>
<script>
/* ══ js/router.js ══ */
/* ═══════════════════════════════════════════════════════════
   RUTAS — navegación por hash (#/clientes). Cada página se
   registra sola con registrarPagina() y el router se encarga
   del resto: pintar, marcar el menú, manejar errores.
   ═══════════════════════════════════════════════════════════ */

var PAGINAS = {};
var rutaActual = '';

/* def = { id, titulo, subtitulo, icono, menu, grupo, montar(cont, params) } */
function registrarPagina(def) { PAGINAS[def.id] = def; }

function irA(id, params) {
  var hash = '#/' + id + (params ? '?' + params : '');
  if (location.hash === hash) pintarRuta();
  else location.hash = hash;
}

function leerRuta() {
  var h = (location.hash || '').replace(/^#\/?/, '');
  var i = h.indexOf('?');
  return {
    id: (i === -1 ? h : h.slice(0, i)) || 'inicio',
    params: new URLSearchParams(i === -1 ? '' : h.slice(i + 1))
  };
}

async function pintarRuta() {
  var r = leerRuta();
  var pagina = PAGINAS[r.id] || PAGINAS.inicio;
  rutaActual = pagina.id;

  document.body.classList.remove('menu-abierto');
  marcarMenu(pagina.id);

  var cont = porId('contenido');
  cont.innerHTML =
    '<div class="contenido-ancho">' +
      '<div class="cabecera">' +
        '<h1>' + esc(pagina.titulo) + '</h1>' +
        (pagina.subtitulo ? '<p>' + esc(pagina.subtitulo) + '</p>' : '') +
      '</div>' +
      '<div id="cuerpo-pagina">' + cargando() + '</div>' +
    '</div>';

  var cuerpo = porId('cuerpo-pagina');
  window.scrollTo(0, 0);

  try {
    await pagina.montar(cuerpo, r.params);
  } catch (e) {
    console.error('[' + pagina.id + ']', e);
    cuerpo.innerHTML = avisoHTML('danger',
      '<strong>No se pudo cargar esta pantalla.</strong><br>' + esc(e.message) +
      '<br><button class="btn btn-secundario" style="margin-top:10px" onclick="pintarRuta()">Reintentar</button>');
  }
}

function marcarMenu(id) {
  $$('.nav-item').forEach(function (b) {
    if (b.dataset.pagina === id) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
}

function construirMenu() {
  var grupos = {};
  Object.keys(PAGINAS).forEach(function (id) {
    var p = PAGINAS[id];
    if (!p.menu) return;
    (grupos[p.grupo || 'General'] = grupos[p.grupo || 'General'] || []).push(p);
  });
  var html = '';
  Object.keys(grupos).forEach(function (g) {
    html += '<div class="nav-grupo">' + esc(g) + '</div>';
    grupos[g].forEach(function (p) {
      html += '<button class="nav-item" data-pagina="' + p.id + '" onclick="irA(\'' + p.id + '\')">' +
                '<span class="nav-ic">' + ic(p.icono, 17) + '</span>' + esc(p.menu) +
              '</button>';
    });
  });
  porId('nav').innerHTML = html;
}

window.addEventListener('hashchange', pintarRuta);

</script>
